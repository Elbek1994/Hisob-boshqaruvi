    accounts_title: 'Счета', accounts_sub: 'Счета и долги', total_balance: 'Общий баланс', total_note: 'Все счета пересчитаны в рубли', transfer: 'Перевод', new_account: 'Новый счёт',
    debts_title: 'Долги и кредиты', debts_sum: 'Задолженность: {n}', debts_none: 'Долгов нет', remit_title: 'Деньги домой', remit_month: 'В этом месяце {n}', remit_none: 'Пока не отправляли',
    limits_title: 'Лимиты и цели', limits_sum: '{n} лимитов · {g} целей накопления', car_title: 'Авто: штрафы и ремонт', car_sub: 'Учёт штрафов и ремонта', car_unpaid: 'Неоплаченных штрафов: {n}',
    rec_title: 'Повторяющиеся платежи', rec_sum: 'Активных: {n}', cats_title: 'Категории', cats_sum: '{n} шт.',
    eve_title: 'Время подвести итог дня', eve_text: 'Чистая прибыль сегодня: {n}. Проверьте записи.', eve_shift: 'Смена ещё не закрыта. Введите итоги выручки и закройте.', eve_check: 'Посмотреть сегодня', eve_done: 'Проверил', eve_ok: 'Отлично! До завтра.',
    dop_pay: 'платёж', dop_borrow: 'взял в долг', dop_lend: 'дал в долг', dop_receive: 'вернули', goals_title: 'Цели накопления',
  });
})(window);

</script>
<script>
(function (g) {
  'use strict';
  const XN = g.XN, U = XN.U, C = XN.calc, S = XN.store, UI = XN.UI, t = XN.t, esc = U.esc;
  const M = (n, cur, o) => U.money(n, cur || 'RUB', o);
  const num = (v) => { const r = U.evalExpr(String(v == null ? '' : v).replace(/\s/g, '').replace(/,/g, '.')); return r == null || !isFinite(r) ? NaN : r; };
  UI.num = num;

  const afterChange = () => { UI.refresh(); };

  /* ================= ADD / EDIT TRANSACTION ================= */
  const KEYS = ['7', '8', '9', 'bs', '4', '5', '6', '+', '1', '2', '3', '-', ',', '0', '00', 'eq'];
  const keyLabel = (k) => (k === 'bs' ? '⌫' : k === 'eq' ? '=' : k === '-' ? '−' : k);

  const debtOps = (d) => (d.kind === 'owed' ? ['receive', 'lend'] : ['pay', 'borrow']);

  UI.openAdd = (init) => {
    init = init || {};
    const s = S.state, cm = XN.catMap(s);
    const type = init.type || (init.cat && cm[init.cat] ? cm[init.cat].type : 'expense');
    const st = {
      type, cat: init.cat || null, acc: init.acc || '', to: '', amt: init.amount ? String(init.amount) : '', cur: init.cur || null, note: init.note || '',
      ts: init.ts || Date.now(), debtId: null, op: null, id: init.id || null, curManual: !!init.cur, err: '',
    };
    if (!st.acc) st.acc = S.defaultAcc(init.acc ? 'cash' : init.cat === 'karta' || init.cat === 'bonus' ? 'card' : 'cash');
    if (init.acc) st.acc = init.acc;
    if (type === 'transfer') { const v = S.visibleAccounts(); st.acc = v[0] ? v[0].id : ''; st.to = v[1] ? v[1].id : ''; }
    if (type === 'debt' && init.debtId) { const d = s.debts.find((x) => x.id === init.debtId); if (d) { st.debtId = d.id; st.op = debtOps(d)[0]; } }
    return openForm(st);
  };

  UI.openEdit = (tx) => {
    if (tx.type === 'remit') return openRemit(tx);
    if (tx.type === 'goal') return openSimpleEdit(tx);
    if (tx.type === 'debt') return openSimpleEdit(tx);
    const st = { type: tx.type, cat: tx.cat, acc: tx.acc, to: tx.to || '', amt: String(tx.amount), cur: tx.cur, note: tx.note || '', ts: tx.ts, id: tx.id, curManual: true, err: '', edit: tx };
    return openForm(st);
  };

  function openForm(st) {
    const sh = UI.sheet({
      cls: 'add', state: st,
      render: (sh) => formHtml(sh.st),
      on: {
        type: (a, e, sh) => { sh.st.type = a.dataset.v; sh.st.cat = null; sh.st.err = ''; if (sh.st.type === 'transfer') { const v = S.visibleAccounts(); if (!sh.st.to || sh.st.to === sh.st.acc) sh.st.to = (v.find((x) => x.id !== sh.st.acc) || {}).id || ''; } sh.update(); },
        cat: (a, e, sh) => { sh.st.cat = a.dataset.v; sh.st.err = ''; sh.update(); },
        acc: (a, e, sh) => { sh.st.acc = a.dataset.v; if (!sh.st.curManual && sh.st.type !== 'transfer') sh.st.cur = null; if (sh.st.to === sh.st.acc) sh.st.to = ''; sh.update(); },
        to: (a, e, sh) => { sh.st.to = a.dataset.v; sh.update(); },
        cur: (a, e, sh) => { sh.st.cur = a.dataset.v; sh.st.curManual = true; sh.update(); },
        debt: (a, e, sh) => { sh.st.debtId = a.dataset.v; const d = S.state.debts.find((x) => x.id === a.dataset.v); sh.st.op = d ? debtOps(d)[0] : null; sh.update(); },
        op: (a, e, sh) => { sh.st.op = a.dataset.v; sh.update(); },
        key: (a, e, sh) => { keyPress(sh.st, a.dataset.v); sh.update(); },
        save: (a, e, sh) => save(sh),
        del: async (a, e, sh) => { const tx = sh.st.edit; sh.close(); const del = S.deleteTx(tx.id); UI.toast(t('deleted'), { label: t('undo'), fn: () => S.restoreTx(del) }); },
        newdebt: (a, e, sh) => { sh.close(); UI.openDebt(null); },
      },
      input: { note: (a, e, sh) => { sh.st.note = a.value; } },
      change: { when: (a, e, sh) => { const v = U.fromLocalInput(a.value); if (v) sh.st.ts = v; } },
      onChange: (sh) => sh.update(),
    });
    return sh;
  }

  function keyPress(st, k) {
    st.err = '';
    if (k === 'bs') { st.amt = st.amt.slice(0, -1); return; }
    if (k === 'eq') { const v = num(st.amt); if (!isNaN(v)) st.amt = String(U.round2(v)).replace('.', ','); return; }
    if (k === ',') { const last = st.amt.split(/[+\-]/).pop(); if (last.indexOf(',') >= 0) return; if (!last) st.amt += '0'; }
    if ((k === '+' || k === '-') && (!st.amt || /[+\-]$/.test(st.amt))) { if (!st.amt) return; st.amt = st.amt.slice(0, -1); }
    if (st.amt.length >= 14) return;
    if (st.amt === '0' && /\d/.test(k)) st.amt = '';
    st.amt += k === '00' && !st.amt ? '0' : k;
  }

  function formHtml(st) {
    const s = S.state, cm = XN.catMap(s), accs = S.visibleAccounts();
    const acc = S.acc(st.acc), cur = st.type === 'transfer' ? (acc ? acc.cur : 'RUB') : st.cur || (acc ? acc.cur : 'RUB');
    const tab = (v, label) => `<button class="seg${st.type === v ? ' on' : ''}" data-s="type" data-v="${v}">${label}</button>`;
    const v = num(st.amt), hasOp = /[+\-]/.test(st.amt.replace(/^-/, ''));
    let mid = '';
    if (st.type === 'expense' || st.type === 'income') {
      const list = s.cats.filter((c) => c.type === st.type && (!c.hidden || c.id === st.cat)).sort((a, b) => (a.order || 0) - (b.order || 0));
      mid = `<div class="chips noswipe">${list.map((c) => UI.catChip(c, st.cat === c.id, `data-s="cat" data-v="${c.id}"`)).join('')}</div>`;
    } else if (st.type === 'debt') {
      const ds = s.debts.filter((d) => !d.closed);
      const cd = s.debts.find((d) => d.id === st.debtId);
      mid = ds.length ? `<div class="chips">${ds.map((d) => `<button class="chip${st.debtId === d.id ? ' sel' : ''}" data-s="debt" data-v="${d.id}"><span class="ce">🏦</span>${esc(d.name)}</button>`).join('')}</div>` : `<div class="hint">${t('no_debts_hint')}</div>`;
      if (cd) mid += `<div class="pills">${debtOps(cd).map((o) => `<button class="pill${st.op === o ? ' sel' : ''}" data-s="op" data-v="${o}">${t('dop_' + o)}</button>`).join('')}</div>`;
      mid += `<button class="link" data-s="newdebt">+ ${t('debt_new')}</button>`;
    }
    const accRow = (key, sel, label) => `<div class="fld"><span class="lbl">${label}</span><div class="pills noswipe">${accs.map((a) => `<button class="pill${sel === a.id ? ' sel' : ''}${key === 'to' && st.acc === a.id ? ' dis' : ''}" data-s="${key}" data-v="${a.id}">${esc(a.ico)} ${esc(a.name)}</button>`).join('')}</div></div>`;
    const toAcc = S.acc(st.to);
    const conv = st.type === 'transfer' && toAcc && acc && toAcc.cur !== acc.cur && v > 0 ? `<div class="hint">≈ ${M(C.conv(v, acc.cur, toAcc.cur, s), toAcc.cur)}</div>` : '';
    return `<div class="sh-scroll">
      ${st.edit ? '' : ''}<div class="segs">${tab('expense', t('expense'))}${tab('income', t('income_t'))}${tab('transfer', t('transfer'))}${tab('debt', t('debt_t'))}</div>
      <div class="amt-box ${st.type === 'income' ? 'pos' : st.type === 'expense' ? 'neg' : ''}"><div class="amt-v">${esc(st.amt || '0')}<em>${XN.curSym(cur)}</em></div>${hasOp && !isNaN(v) ? `<small>= ${U.fmtNum(U.round2(v))}</small>` : ''}${conv}</div>
      ${st.type !== 'transfer' ? `<div class="pills cur">${XN.CURS.map((c) => `<button class="pill sm${cur === c ? ' sel' : ''}" data-s="cur" data-v="${c}">${XN.curSym(c)} ${c}</button>`).join('')}</div>` : ''}
      ${mid}
      ${st.type === 'debt' && !st.debtId ? '' : accRow('acc', st.acc, st.type === 'transfer' ? t('from_acc') : t('account'))}
      ${st.type === 'transfer' ? accRow('to', st.to, t('to_acc')) : ''}
      <div class="fld row2"><label class="inp"><span class="lbl">${t('note')}</span><input type="text" data-si="note" value="${esc(st.note)}" maxlength="120" placeholder="${t('note')}"></label>
        <label class="inp"><span class="lbl">${t('date')}</span><input type="datetime-local" data-sc="when" value="${U.toLocalInput(st.ts)}"></label></div>
      <div class="err">${esc(st.err || '')}</div></div>
      <div class="pad">${KEYS.map((k) => `<button class="key${/[+\-]|eq|bs/.test(k) && k.length < 3 ? ' op' : ''}" data-s="key" data-v="${k}" aria-label="${keyLabel(k)}">${keyLabel(k)}</button>`).join('')}</div>
      <div class="btn-row sh-foot">${st.edit ? `<button class="btn btn-danger" data-s="del">${UI.icon('trash', 18)}</button>` : ''}<button class="btn btn-primary big" data-s="save">${UI.icon('check', 20)} ${t('save')}</button></div>`;
  }

  function save(sh) {
    const st = sh.st, s = S.state;
    const amount = num(st.amt);
    const fail = (k) => { st.err = t(k); UI.buzz(30); sh.update(); };
    if (!(amount > 0)) return fail('err_amount');
    if (st.type === 'transfer') {
      if (!st.acc || !st.to || st.acc === st.to) return fail('err_transfer');
      const d = { type: 'transfer', acc: st.acc, to: st.to, amount, note: st.note.trim(), ts: st.ts };
      if (st.id) S.editTx(st.id, Object.assign(d, { toAmt: undefined })); else S.addTx(d);
    } else if (st.type === 'debt') {
      if (!st.debtId || !st.op) return fail('err_debt');
      S.debtTx(st.debtId, st.op, amount, st.acc, st.ts);
    } else {
      if (!st.cat) return fail('err_cat');
      const acc = S.acc(st.acc);
      const d = { type: st.type, cat: st.cat, amount, cur: st.cur || (acc ? acc.cur : 'RUB'), acc: st.acc, note: st.note.trim(), ts: st.ts };
      if (st.id) S.editTx(st.id, d); else S.addTx(d);
    }
    UI.buzz(15);
    sh.close();
    UI.toast(t('saved'));
    checkLimits();
  }

  // warn right after saving an expense if a limit was crossed
  function checkLimits() {
    const s = S.state, now = Date.now(), cm = XN.catMap(s);
    for (const l of s.limits) {
      const ls = C.limitStatus(s, l, now);
      if (ls.over || ls.pct >= 0.8) {
        const name = l.kind === 'cat' ? XN.catName(cm[l.ref]) : l.kind === 'group' ? t('group_' + l.ref) : t('lim_total');
        const key = 'warned.' + l.id + '.' + (ls.over ? 'o' : 'w') + '.' + U.som(now);
        try { if (g.sessionStorage.getItem(key)) continue; g.sessionStorage.setItem(key, '1'); } catch (e) { /* ignore */ }
        g.setTimeout(() => UI.toast(ls.over ? t('tip_limit_over', { name, spent: M(ls.spent), limit: M(l.amount) }) : t('tip_limit_80', { name, p: Math.round(ls.pct * 100), spent: M(ls.spent), limit: M(l.amount) }), { ms: 5000 }), 600);
        break;
      }
    }
  }

  /* ---------- simple edit: debt / goal tx (amount, date, delete) ---------- */
  function openSimpleEdit(tx) {
    UI.sheet({
      state: { amt: String(tx.amount), ts: tx.ts, note: tx.note || '' },
      render: (sh) => `<div class="sh-scroll"><h3>${esc(UI.txView(tx).title)}</h3>
        <label class="inp"><span class="lbl">${t('amount')}</span><input type="text" inputmode="decimal" data-si="amt" value="${esc(sh.st.amt)}"></label>
        <label class="inp"><span class="lbl">${t('date')}</span><input type="datetime-local" data-sc="when" value="${U.toLocalInput(sh.st.ts)}"></label>
        <div class="err">${esc(sh.st.err || '')}</div></div>
        <div class="btn-row sh-foot"><button class="btn btn-danger" data-s="del">${UI.icon('trash', 18)}</button><button class="btn btn-primary big" data-s="save">${t('save')}</button></div>`,
      input: { amt: (a, e, sh) => { sh.st.amt = a.value; } },
      change: { when: (a, e, sh) => { const v = U.fromLocalInput(a.value); if (v) sh.st.ts = v; } },
      on: {
        save: (a, e, sh) => { const v = num(sh.st.amt); if (!(v > 0)) { sh.st.err = t('err_amount'); sh.update(); return; } S.editTx(tx.id, { amount: v, ts: sh.st.ts }); sh.close(); UI.toast(t('saved')); },
        del: (a, e, sh) => { sh.close(); const del = S.deleteTx(tx.id); UI.toast(t('deleted'), { label: t('undo'), fn: () => S.restoreTx(del) }); },
      },
    });
  }

  /* ================= REMIT ================= */
  function openRemit(tx) {
    const s = S.state;
    const st = { usd: tx ? String(tx.usd) : '', rate: tx ? String(tx.rate) : String(s.settings.usdRub), acc: tx ? tx.acc : S.defaultAcc('cash'), note: tx ? tx.note || '' : '', ts: tx ? tx.ts : Date.now(), err: '' };
    UI.sheet({
      state: st,
      render: (sh) => {
        const usd = num(sh.st.usd), rate = num(sh.st.rate), rub = usd > 0 && rate > 0 ? usd * rate : 0;
        return `<div class="sh-scroll"><h3>💸 ${t('remit_title')}</h3>
        <div class="grid2"><label class="inp"><span class="lbl">$ ${t('usd_amount')}</span><input type="text" inputmode="decimal" data-si="usd" value="${esc(sh.st.usd)}" placeholder="0"></label>
        <label class="inp"><span class="lbl">${t('rate')} (₽/$)</span><input type="text" inputmode="decimal" data-si="rate" value="${esc(sh.st.rate)}"></label></div>
        <div class="amt-box neg"><div class="amt-v" id="remit-rub">${M(rub)}</div><small>${t('remit_calc')}</small></div>
        <div class="fld"><span class="lbl">${t('account')}</span><div class="pills">${S.visibleAccounts().map((a) => `<button class="pill${sh.st.acc === a.id ? ' sel' : ''}" data-s="acc" data-v="${a.id}">${esc(a.ico)} ${esc(a.name)}</button>`).join('')}</div></div>
        <div class="fld row2"><label class="inp"><span class="lbl">${t('note')}</span><input type="text" data-si="note" value="${esc(sh.st.note)}" maxlength="120"></label>
        <label class="inp"><span class="lbl">${t('date')}</span><input type="datetime-local" data-sc="when" value="${U.toLocalInput(sh.st.ts)}"></label></div>
        <div class="err">${esc(sh.st.err)}</div></div>
        <div class="btn-row sh-foot">${tx ? `<button class="btn btn-danger" data-s="del">${UI.icon('trash', 18)}</button>` : ''}<button class="btn btn-primary big" data-s="save">${UI.icon('check', 20)} ${t('save')}</button></div>`;
      },
      input: {
        usd: (a, e, sh) => { sh.st.usd = a.value; recalc(sh); }, rate: (a, e, sh) => { sh.st.rate = a.value; recalc(sh); }, note: (a, e, sh) => { sh.st.note = a.value; },
      },
      change: { when: (a, e, sh) => { const v = U.fromLocalInput(a.value); if (v) sh.st.ts = v; } },
      on: {
        acc: (a, e, sh) => { sh.st.acc = a.dataset.v; sh.update(); },
        save: (a, e, sh) => {
          const usd = num(sh.st.usd), rate = num(sh.st.rate);
          if (!(usd > 0) || !(rate > 0)) { sh.st.err = t('err_amount'); sh.update(); return; }
          const d = { type: 'remit', usd, rate, acc: sh.st.acc, note: sh.st.note.trim(), ts: sh.st.ts, rub: undefined };
          if (tx) S.editTx(tx.id, d); else S.addTx(d);
          if (!tx) { S.state.settings.usdRub = rate; S.commit(); }
          sh.close(); UI.toast(t('saved'));
        },
        del: (a, e, sh) => { sh.close(); const del = S.deleteTx(tx.id); UI.toast(t('deleted'), { label: t('undo'), fn: () => S.restoreTx(del) }); },
      },
    });
    function recalc(sh) { const el = sh.el.querySelector('#remit-rub'); const u = num(sh.st.usd), r = num(sh.st.rate); if (el) el.textContent = M(u > 0 && r > 0 ? u * r : 0); }
  }
  UI.openRemit = () => openRemit(null);

  /* ================= SHIFT: close, detail ================= */
  UI.openCloseShift = () => {
    const sh0 = C.activeShift(S.state);
    if (!sh0) return;
    const st = { cash: '', card: '', bonus: '', orders: String(sh0.orders || ''), km: '', note: '', err: '' };
    UI.sheet({
      state: st,
      render: (sh) => {
        const fld = (k, label, mode) => `<label class="inp"><span class="lbl">${label}</span><input type="text" inputmode="${mode || 'decimal'}" data-si="${k}" value="${esc(sh.st[k])}" placeholder="0"></label>`;
        const cur = C.shiftStats(S.state, sh0, Date.now());
        return `<div class="sh-scroll"><h3>${t('shift_finish')}</h3><p class="mut">${t('close_hint')} ${U.fmtDur(Date.now() - sh0.start)} · ${t('already')}: ${M(cur.revenue)}</p>
          <div class="grid2">${fld('cash', '💵 ' + t('cash_rev'))}${fld('card', '💳 ' + t('card_rev'))}</div>
          <div class="grid2">${fld('bonus', '🎁 ' + t('bonus_rev'))}${fld('orders', t('orders'), 'numeric')}</div>
          <div class="grid2">${fld('km', t('km'))}<label class="inp"><span class="lbl">${t('note')}</span><input type="text" data-si="note" value="${esc(sh.st.note)}" maxlength="120"></label></div>
          <div class="err">${esc(sh.st.err)}</div></div>
          <div class="btn-row sh-foot"><button class="btn" data-s="cancel">${t('cancel')}</button><button class="btn btn-stop big" data-s="ok">${UI.icon('stop', 18)} ${t('shift_finish')}</button></div>`;
      },
      input: { cash: (a, e, s) => { s.st.cash = a.value; }, card: (a, e, s) => { s.st.card = a.value; }, bonus: (a, e, s) => { s.st.bonus = a.value; }, orders: (a, e, s) => { s.st.orders = a.value; }, km: (a, e, s) => { s.st.km = a.value; }, note: (a, e, s) => { s.st.note = a.value; } },
      on: {
        cancel: (a, e, sh) => sh.close(),
        ok: (a, e, sh) => {
          const v = (k) => { const x = sh.st[k] === '' ? 0 : num(sh.st[k]); return x; };
          const vals = ['cash', 'card', 'bonus', 'orders', 'km'].map(v);
          if (vals.some((x) => isNaN(x) || x < 0)) { sh.st.err = t('err_amount'); sh.update(); return; }
          S.closeShift(sh0.id, { cash: vals[0], card: vals[1], bonus: vals[2], orders: vals[3], km: vals[4], note: sh.st.note });
          sh.close();
          const stt = C.shiftStats(S.state, S.state.shifts.find((x) => x.id === sh0.id), Date.now());
          UI.toast(t('shift_done', { n: M(stt.net, 'RUB', { plus: true }) }), { ms: 4500 });
        },
      },
    });
  };

  UI.openShiftDetail = (id) => {
    const sh0 = S.state.shifts.find((x) => x.id === id);
    if (!sh0) return;
    UI.sheet({
      state: { tariff: sh0.tariff },
      render: (sh) => {
        const x = S.state.shifts.find((y) => y.id === id) || sh0;
        const st = C.shiftStats(S.state, x, x.end || Date.now());
        const ops = S.state.txs.filter((tx) => tx.shiftId === id).sort((a, b) => a.ts - b.ts);
        return `<div class="sh-scroll"><h3>${U.fmtDayLabel(x.start)} · ${U.fmtTime(x.start)}${x.end ? '–' + U.fmtTime(x.end) : ''}</h3>
          <div class="pills">${XN.TARIFFS.map((k) => `<button class="pill sm${sh.st.tariff === k ? ' sel' : ''}" data-s="tariff" data-v="${k}">${t('tariff_' + k)}</button>`).join('')}</div>
          <div class="grid2">${UI.metric(t('revenue'), M(st.revenue), 'pos')}${UI.metric(t('costs'), M(st.costs), 'neg')}${UI.metric(t('net_profit'), M(st.net, 'RUB', { plus: true }), st.net >= 0 ? 'pos' : 'neg')}${UI.metric(t('per_hour'), st.perHour == null ? '—' : M(st.perHour))}
          ${UI.metric(t('orders'), x.orders || 0)}${UI.metric(t('km'), x.km ? U.fmtNum(x.km) : '—')}</div>
          ${ops.length ? `<div class="card list tight">${ops.map((o) => UI.txRow(o)).join('')}</div>` : ''}</div>
          <div class="btn-row sh-foot"><button class="btn btn-danger" data-s="del">${UI.icon('trash', 18)}</button><button class="btn big" data-s="close2">${t('close')}</button></div>`;
      },
      on: {
        tariff: (a, e, sh) => { sh.st.tariff = a.dataset.v; S.updateShift(id, { tariff: a.dataset.v }); sh.update(); },
        close2: (a, e, sh) => sh.close(),
        del: async (a, e, sh) => { if (await UI.confirm({ title: t('shift_del_q'), text: t('shift_del_t'), danger: true, ok: t('delete') })) { sh.close(); S.deleteShift(id); UI.toast(t('deleted')); } },
      },
      onChange: (sh) => { if (S.state.shifts.some((x) => x.id === id)) sh.update(); },
    });
  };

  /* ================= REMINDER PAY ================= */
  UI.payReminder = (kind, id) => {
    const s = S.state;
    const done = () => UI.toast(t('paid_ok'));
    const acc = S.defaultAcc('cash');
    if (kind === 'fine') { S.payFine(id, acc); return done(); }
    if (kind === 'rec') { const r = s.recurring.find((x) => x.id === id); if (!r) return; S.completeRecurring(id, r.acc || acc); return done(); }
    if (kind === 'debt') {
      const d = s.debts.find((x) => x.id === id); if (!d) return;
      const i = C.debtInfo(s, d, Date.now());
      UI.openAdd({ type: 'debt', debtId: id, amount: String(d.monthly > 0 ? Math.min(d.monthly, i.remaining) : i.remaining).replace('.', ','), cur: d.cur });
    }
  };

  /* ================= ACCOUNT EDITOR ================= */
  UI.openAccount = (id) => {
    const a = id ? S.acc(id) : null;
    const st = { name: a ? a.name : '', cur: a ? a.cur : 'RUB', open: a ? String(a.open || '') : '', ico: a ? a.ico : '🏦', kind: a ? a.kind : 'other', err: '' };
    const ICOS = ['💵', '💳', '🏦', '💰', '🪙', '👛', '📱', '🇺🇸'];
    UI.sheet({
      state: st,
      render: (sh) => `<div class="sh-scroll"><h3>${a ? t('edit') : t('new_account')}</h3>
        <label class="inp"><span class="lbl">${t('name')}</span><input type="text" data-si="name" value="${esc(sh.st.name)}" maxlength="30"></label>
        <div class="fld"><span class="lbl">${t('currency')}</span><div class="pills">${XN.CURS.map((c) => `<button class="pill${sh.st.cur === c ? ' sel' : ''}" data-s="cur" data-v="${c}">${XN.curSym(c)} ${c}</button>`).join('')}</div></div>
        <label class="inp"><span class="lbl">${t('opening')}</span><input type="text" inputmode="decimal" data-si="open" value="${esc(sh.st.open)}" placeholder="0"></label>
        <div class="fld"><span class="lbl">${t('icon')}</span><div class="pills">${ICOS.map((c) => `<button class="pill${sh.st.ico === c ? ' sel' : ''}" data-s="ico" data-v="${c}">${c}</button>`).join('')}</div></div>
        <div class="err">${esc(sh.st.err)}</div></div>
        <div class="btn-row sh-foot">${a ? `<button class="btn btn-danger" data-s="del">${UI.icon('trash', 18)}</button>` : ''}<button class="btn btn-primary big" data-s="save">${t('save')}</button></div>`,
      input: { name: (x, e, sh) => { sh.st.name = x.value; }, open: (x, e, sh) => { sh.st.open = x.value; } },
      on: {
        cur: (x, e, sh) => { sh.st.cur = x.dataset.v; sh.update(); }, ico: (x, e, sh) => { sh.st.ico = x.dataset.v; sh.update(); },
        save: (x, e, sh) => {
          const open = sh.st.open === '' ? 0 : num(sh.st.open);
          if (!sh.st.name.trim() || isNaN(open)) { sh.st.err = t('err_name'); sh.update(); return; }
          const d = { name: sh.st.name, cur: sh.st.cur, open, ico: sh.st.ico };
          if (a) S.editAccount(a.id, d); else S.addAccount(d);
          sh.close(); UI.toast(t('saved'));
        },
        del: async (x, e, sh) => {
          if (!(await UI.confirm({ title: t('acc_del_q'), text: S.accountUsed(a.id) ? t('acc_del_hide') : '', danger: true, ok: t('delete') }))) return;
          const r = S.deleteAccount(a.id);
          if (r === 'last') return UI.toast(t('acc_last'));
          sh.close(); UI.toast(t('deleted'));
        },
      },
    });
  };

  /* ================= QUICK EDIT (home) ================= */
  UI.acts['edit-quick'] = () => {
    const s = S.state;
    UI.sheet({
      state: { sel: s.quick.slice() },
      render: (sh) => {
        const list = s.cats.filter((c) => !c.hidden).sort((a, b) => (a.order || 0) - (b.order || 0));
        return `<div class="sh-scroll"><h3>${t('quick_add')}</h3><p class="mut">${t('quick_hint')} (${sh.st.sel.length}/8)</p>
          <div class="chips">${list.map((c) => UI.catChip(c, sh.st.sel.indexOf(c.id) >= 0, `data-s="q" data-v="${c.id}"`)).join('')}</div></div>
          <div class="btn-row sh-foot"><button class="btn btn-primary big" data-s="ok">${t('done')}</button></div>`;
      },
      on: {
        q: (a, e, sh) => { const i = sh.st.sel.indexOf(a.dataset.v); if (i >= 0) sh.st.sel.splice(i, 1); else if (sh.st.sel.length < 8) sh.st.sel.push(a.dataset.v); sh.update(); },
        ok: (a, e, sh) => { S.setQuick(sh.st.sel); sh.close(); },
      },
    });
  };

  XN.i18n.add('uz', {
    expense: 'Xarajat', income_t: 'Daromad', debt_t: 'Qarz', account: 'Hisob', from_acc: 'Qaysi hisobdan', to_acc: 'Qaysi hisobga', currency: 'Valyuta', opening: 'Boshlang\'ich qoldiq', icon: 'Belgi',
    err_amount: 'Summani to\'g\'ri kiriting', err_transfer: 'Ikki xil hisob tanlang', err_debt: 'Qarzni va amalni tanlang', err_cat: 'Kategoriyani tanlang', err_name: 'Nom va summani tekshiring',
    no_debts_hint: 'Hali qarz qo\'shilmagan.', debt_new: 'Yangi qarz', usd_amount: 'Dollar', rate: 'Kurs', remit_calc: 'Rublda',
    close_hint: 'Smena davomiyligi', already: 'qayd etilgan tushum', cash_rev: 'Naxt tushum', card_rev: 'Karta tushum', bonus_rev: 'Bonus', km: 'Masofa (km)', shift_done: 'Smena yopildi. Sof foyda: {n}',
    shift_del_q: "Smenani o'chirasizmi?", shift_del_t: "Operatsiyalar saqlanadi, faqat avtomatik ijara o'chadi.", paid_ok: "To'landi", acc_del_q: "Hisobni o'chirasizmi?", acc_del_hide: "Operatsiyalar bor, hisob yashiriladi.", acc_last: "Oxirgi hisobni o'chirib bo'lmaydi",
    stop: "To'xtatish", v_listening: 'Tinglayapman… gapiring', v_tap: 'Bosing va gapiring: «Benzin 1500»', v_speak: 'Gapirish', v_unsupported: "Bu brauzerda ovoz yo'q. Matn bilan yozing.", v_or_type: 'Yoki yozing', v_example: 'masalan: benzin 1500 karta',
    v_nocat: 'Kategoriya topilmadi', v_check: 'Iltimos, tekshirib oling', v_noamt: 'Summa topilmadi', v_use: 'Davom etish', v_err_perm: 'Mikrofonga ruxsat berilmagan', v_err_none: 'Ovoz eshitilmadi', v_err_net: 'Ovoz uchun internet kerak', v_err_gen: 'Ovozni aniqlab bo\'lmadi',
    quick_hint: 'Bosh sahifadagi tez tugmalar (8 tagacha)',
  });
  XN.i18n.add('ru', {
    expense: 'Расход', income_t: 'Доход', debt_t: 'Долг', account: 'Счёт', from_acc: 'Со счёта', to_acc: 'На счёт', currency: 'Валюта', opening: 'Начальный остаток', icon: 'Значок',
    err_amount: 'Введите сумму правильно', err_transfer: 'Выберите два разных счёта', err_debt: 'Выберите долг и действие', err_cat: 'Выберите категорию', err_name: 'Проверьте название и сумму',
    no_debts_hint: 'Долгов пока нет.', debt_new: 'Новый долг', usd_amount: 'Доллары', rate: 'Курс', remit_calc: 'В рублях',
    close_hint: 'Длительность смены', already: 'уже записано выручки', cash_rev: 'Наличные', card_rev: 'На карту', bonus_rev: 'Бонус', km: 'Пробег (км)', shift_done: 'Смена закрыта. Чистая прибыль: {n}',
    shift_del_q: 'Удалить смену?', shift_del_t: 'Операции сохранятся, удалится только автоматическая аренда.', paid_ok: 'Оплачено', acc_del_q: 'Удалить счёт?', acc_del_hide: 'Есть операции, счёт будет скрыт.', acc_last: 'Нельзя удалить последний счёт',
    stop: 'Стоп', v_listening: 'Слушаю… говорите', v_tap: 'Нажмите и скажите: «Бензин 1500»', v_speak: 'Говорить', v_unsupported: 'В этом браузере нет голоса. Введите текстом.', v_or_type: 'Или введите', v_example: 'например: бензин 1500 карта',
    v_nocat: 'Категория не найдена', v_check: 'Пожалуйста, проверьте', v_noamt: 'Сумма не найдена', v_use: 'Продолжить', v_err_perm: 'Нет доступа к микрофону', v_err_none: 'Речь не слышна', v_err_net: 'Для голоса нужен интернет', v_err_gen: 'Не удалось распознать речь',
    quick_hint: 'Быстрые кнопки на главной (до 8)',
  });
})(window);

</script>
<script>
(function (g) {
  'use strict';
  const XN = g.XN, U = XN.U, C = XN.calc, S = XN.store, UI = XN.UI, t = XN.t, esc = U.esc, num = UI.num;
  const M = (n, cur, o) => U.money(n, cur || 'RUB', o);
  const doc = g.document;
  const topScreen = (name) => UI.layers.slice().reverse().find((l) => l.kind === 'screen' && l.name === name);
  const add = (label, act, extra) => `<button class="btn btn-primary fab-row" data-act="${act}" ${extra || ''}>${UI.icon('plus', 18)} ${label}</button>`;
  const empty = (ico, text) => `<div class="card empty"><div class="empty-i">${ico}</div><p>${esc(text)}</p></div>`;

  /* ================= generic form sheet =================
     fields: {k,label,type:'text'|'num'|'date'|'pills'|'chips'|'emoji',opts:[{v,l}],ph,suffix,show(vals)} */
  UI.form = (o) => {
    const vals = Object.assign({}, o.values);
    return UI.sheet({
      state: { v: vals, err: '' },
      render: (sh) => {
        const v = sh.st.v;
        const fl = o.fields.filter((f) => !f.show || f.show(v)).map((f) => {
          if (f.type === 'pills' || f.type === 'chips') {
            return `<div class="fld"><span class="lbl">${f.label}</span><div class="${f.type === 'chips' ? 'chips' : 'pills'}">${f.opts.map((p) => `<button class="${f.type === 'chips' ? 'chip' : 'pill'}${String(v[f.k]) === String(p.v) ? ' sel' : ''}" data-s="pick" data-k="${f.k}" data-v="${esc(p.v)}">${p.l}</button>`).join('')}</div></div>`;
          }
          const type = f.type === 'date' ? 'date' : 'text';
          const mode = f.type === 'num' ? ' inputmode="decimal"' : '';
          return `<label class="inp"><span class="lbl">${f.label}</span><input type="${type}"${mode} data-si="f" data-k="${f.k}" value="${esc(v[f.k] == null ? '' : v[f.k])}" placeholder="${esc(f.ph || '')}" maxlength="${f.type === 'emoji' ? 4 : 60}"></label>`;
        }).join('');
        return `<div class="sh-scroll"><h3>${o.title}</h3>${o.hint ? `<p class="mut">${o.hint}</p>` : ''}${fl}<div class="err">${esc(sh.st.err)}</div></div>
          <div class="btn-row sh-foot">${o.onDelete ? `<button class="btn btn-danger" data-s="del" aria-label="${t('delete')}">${UI.icon('trash', 18)}</button>` : ''}<button class="btn btn-primary big" data-s="save">${UI.icon('check', 20)} ${o.saveLabel || t('save')}</button></div>`;
      },
      input: { f: (a, e, sh) => { sh.st.v[a.dataset.k] = a.value; } },
      on: {
        pick: (a, e, sh) => { sh.st.v[a.dataset.k] = a.dataset.v; if (o.onPick) o.onPick(a.dataset.k, a.dataset.v, sh.st.v); sh.update(); },
        save: (a, e, sh) => {
          const err = o.onSave(sh.st.v, sh);
          if (err) { sh.st.err = err; UI.buzz(30); sh.update(); return; }
          sh.close(); UI.toast(t('saved'));
        },
        del: async (a, e, sh) => { if (await UI.confirm({ title: o.delTitle || t('del_q'), text: o.delText || '', danger: true, ok: t('delete') })) { sh.close(); o.onDelete(); UI.toast(t('deleted')); } },
      },
    });
  };
  const opts = (arr, fn) => arr.map((x) => ({ v: x, l: fn(x) }));
  const curOpts = () => XN.CURS.map((c) => ({ v: c, l: XN.curSym(c) + ' ' + c }));
  const dateStr = (ts) => (ts ? U.toDateInput(ts) : '');
  const parseDate = (s) => (s ? U.fromDateInput(s) : null);

  /* ================= HISTORY ================= */
  UI.screens.history = {
    scene: 'stars',
    title: (p) => (p.acc && S.acc(p.acc) ? esc(S.acc(p.acc).name) : t('history_title')),
    right: (p, l) => `<button class="icon-btn${p.cal ? ' on' : ''}" data-act="h-cal" aria-label="${t('calendar')}">${UI.icon('calendar')}</button>`,
    body: (p) => {
      if (p.m == null) p.m = U.som(Date.now());
      if (!p.type) p.type = 'all';
      const isNow = p.m === U.som(Date.now());
      const pill = (v, l) => `<button class="pill sm${p.type === v ? ' sel' : ''}" data-act="h-type" data-v="${v}">${l}</button>`;
      return `<div class="h-ctl noswipe"><label class="search">${UI.icon('search', 18)}<input type="search" data-in="h-q" value="${esc(p.q || '')}" placeholder="${t('search_ph')}"></label>
        <div class="pills">${pill('all', t('all'))}${pill('expense', t('expense'))}${pill('income', t('income_t'))}${pill('other', t('other_t'))}</div>
        <div class="monthnav"><button class="icon-btn" data-act="h-m" data-d="-1">${UI.icon('left')}</button><b>${U.monthName(p.m)} ${new Date(p.m).getFullYear()}</b><button class="icon-btn" data-act="h-m" data-d="1" ${isNow ? 'disabled' : ''}>${UI.icon('right')}</button></div></div>
        <div class="h-body">${histBody(p)}</div>`;
    },
  };
  function histFilter(p) {
    const s = S.state, cm = XN.catMap(s), q = (p.q || '').trim().toLowerCase();
    const from = p.day != null ? p.day : p.m, to = p.day != null ? p.day + 864e5 : U.eom(p.m);
    return s.txs.filter((x) => {
      if (x.ts < from || x.ts >= to) return false;
      if (p.acc && x.acc !== p.acc && x.to !== p.acc) return false;
      if (p.type === 'expense' && x.type !== 'expense') return false;
      if (p.type === 'income' && x.type !== 'income') return false;
      if (p.type === 'other' && (x.type === 'expense' || x.type === 'income')) return false;
      if (q) {
        const c = cm[x.cat], v = UI.txView(x);
        const hay = [x.note, c && XN.catName(c), v.title, String(x.amount)].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort((a, b) => b.ts - a.ts);
  }
  function histBody(p) {
    const list = histFilter(p);
    let cal = '';
    if (p.cal) {
      const ser = {}; C.dailySeries(S.state, p.m, U.eom(p.m)).forEach((d) => { ser[U.sod(d.ts)] = d; });
      const first = U.wd(p.m), n = U.dim(p.m);
      let cells = '';
      for (let i = 0; i < first; i++) cells += '<i class="cal-e"></i>';
      for (let d = 1; d <= n; d++) {
        const ts = U.monthDay(new Date(p.m).getFullYear(), new Date(p.m).getMonth(), d), x = ser[ts];
        const net = x ? x.net : 0, has = x && (x.income || x.expense);
        cells += `<button class="cal-d${p.day === ts ? ' sel' : ''}${has ? (net >= 0 ? ' up' : ' dn') : ''}" data-act="h-day" data-ts="${ts}"><b>${d}</b>${has ? `<small>${U.fmtNum(net / 1000, 1)}k</small>` : ''}</button>`;
      }
      cal = `<div class="card cal"><div class="cal-h">${XN.tl('wd_s').map((w) => `<span>${w}</span>`).join('')}</div><div class="cal-g">${cells}</div></div>`;
    }
    if (!list.length) return cal + empty('🔎', t('nothing_found'));
    const groups = {};
    list.forEach((x) => { const k = U.sod(x.ts); (groups[k] = groups[k] || []).push(x); });
    const inc = list.filter((x) => x.type === 'income').reduce((a, x) => a + x.rub, 0), exp = list.filter((x) => x.type === 'expense').reduce((a, x) => a + x.rub, 0);
    return cal + `<div class="kv sumbar"><span>${t('income')} <b class="pos">${M(inc)}</b></span><span>${t('expense')} <b class="neg">${M(exp)}</b></span></div>` +
      Object.keys(groups).sort((a, b) => b - a).map((k) => {
        const net = groups[k].reduce((a, x) => a + (x.type === 'income' ? x.rub : x.type === 'expense' ? -x.rub : 0), 0);
        return `<div class="day-h"><span>${U.fmtDayLabel(+k)}</span><b class="${net >= 0 ? 'pos' : 'neg'}">${M(net, 'RUB', { plus: true })}</b></div><div class="card list">${groups[k].map((x) => UI.txRow(x)).join('')}</div>`;
      }).join('');
  }
  const hRefresh = () => { const l = topScreen('history'); if (l) UI.renderScreen(l, true); };
  UI.acts['h-cal'] = () => { const l = topScreen('history'); l.params.cal = !l.params.cal; if (!l.params.cal) l.params.day = null; UI.renderScreen(l, true); };
  UI.acts['h-type'] = (a) => { const l = topScreen('history'); l.params.type = a.dataset.v; UI.renderScreen(l, true); };
  UI.acts['h-m'] = (a) => { const l = topScreen('history'); l.params.m = Math.min(U.som(Date.now()), U.addMonths(l.params.m, +a.dataset.d)); l.params.day = null; UI.renderScreen(l, true); };
  UI.acts['h-day'] = (a) => { const l = topScreen('history'); const ts = +a.dataset.ts; l.params.day = l.params.day === ts ? null : ts; UI.renderScreen(l, true); };
  UI.ins['h-q'] = (el) => {
    const l = topScreen('history'); if (!l) return;
    l.params.q = el.value;
    const b = l.el.querySelector('.h-body'); if (b) b.innerHTML = histBody(l.params);
  };

  /* ================= DEBTS ================= */
  const debtKinds = () => [{ v: 'credit', l: t('dk_credit') }, { v: 'loan', l: t('dk_loan') }, { v: 'owed', l: t('dk_owed') }];
  UI.openDebt = (d) => {
    const nd = !d;
    UI.form({
      title: nd ? t('debt_new') : t('edit'),
      values: d ? { kind: d.kind, name: d.name, principal: d.principal, cur: d.cur, monthly: d.monthly || '', dueDay: d.dueDay || '', due: dateStr(d.due), note: d.note || '', moneyIn: 'no', acc: S.defaultAcc('cash') } : { kind: 'credit', name: '', principal: '', cur: 'RUB', monthly: '', dueDay: '', due: '', note: '', moneyIn: 'no', acc: S.defaultAcc('cash') },
      fields: [
        { k: 'kind', label: t('type'), type: 'pills', opts: debtKinds() },
        { k: 'name', label: t('name'), type: 'text', ph: t('debt_ph') },
        { k: 'principal', label: t('debt_total'), type: 'num', ph: '0' },
        { k: 'cur', label: t('currency'), type: 'pills', opts: curOpts() },
        { k: 'monthly', label: t('monthly_pay'), type: 'num', ph: '0', show: (v) => v.kind !== 'owed' },
        { k: 'dueDay', label: t('due_day'), type: 'num', ph: '1–31' },
        { k: 'due', label: t('due_date'), type: 'date' },
        { k: 'moneyIn', label: t('money_in_q'), type: 'pills', opts: [{ v: 'no', l: t('no') }, { v: 'yes', l: t('yes') }], show: () => nd },
        { k: 'acc', label: t('account'), type: 'pills', opts: S.visibleAccounts().map((a) => ({ v: a.id, l: a.ico + ' ' + a.name })), show: (v) => nd && v.moneyIn === 'yes' },
        { k: 'note', label: t('note'), type: 'text' },
      ],
      onSave: (v) => {
        const p = num(v.principal), mo = v.monthly === '' ? 0 : num(v.monthly), dd = v.dueDay === '' ? 0 : Math.round(num(v.dueDay));
        if (!v.name.trim()) return t('err_name');
        if (!(p > 0) || isNaN(mo) || isNaN(dd) || dd < 0 || dd > 31) return t('err_amount');
        const data = { kind: v.kind, name: v.name.trim(), principal: p, cur: v.cur, monthly: v.kind === 'owed' ? 0 : mo, dueDay: dd, due: parseDate(v.due), note: v.note };
        if (nd) S.addDebt(data, v.moneyIn === 'yes' ? { amount: p, acc: v.acc } : null); else S.editDebt(d.id, data);
        return null;
      },
      onDelete: nd ? null : () => S.deleteDebt(d.id), delTitle: t('debt_del_q'), delText: t('debt_del_t'),
    });
  };
  UI.screens.debts = {
    scene: 'sunset', title: () => t('debts_title'),
    body: () => {
      const s = S.state, now = Date.now(), r = C.rubPer(s);
      const open = s.debts.filter((d) => !d.closed), closed = s.debts.filter((d) => d.closed);
      const owe = open.filter((d) => d.kind !== 'owed').reduce((a, d) => a + C.debtInfo(s, d, now).remaining * r[d.cur], 0);
      const owed = open.filter((d) => d.kind === 'owed').reduce((a, d) => a + C.debtInfo(s, d, now).remaining * r[d.cur], 0);
      const row = (d) => {
        const i = C.debtInfo(s, d, now);

      render: () => {

        const txs = s.txs.filter((x) => x.debtId === id).sort((x, y) => y.ts - x.ts);

        return `<div class="sh-scroll"><h3>${esc(d.name)}</h3>
          <div class="card"><div class="metrics3"><div class="metric"><span class="lbl">${t('debt_total')}</span><b>${M(i.total, d.cur)}</b></div><div class="metric"><span class="lbl">${d.kind === 'owed' ? t('received') : t('paid')}</span><b class="pos">${M(i.paid, d.cur)}</b></div><div class="metric"><span class="lbl">${t('left')}</span><b class="neg">${M(i.remaining, d.cur)}</b></div></div><div class="bar"><i style="width:${(i.pct * 100).toFixed(0)}%"></i></div></div>

          <div class="btn-row sh-foot"><button class="btn" data-s="edit">${UI.icon('edit', 18)} ${t('edit')}</button><button class="btn" data-s="toggle">${d.closed ? t('reopen') : t('close_debt')}</button></div>`;

  /* ================= REMIT ================= */

        ${add(t('remit_new'), 'remit-new')}
        ${all.length ? `<div class="card list">${all.map((x) => UI.txRow(x, { date: true })).join('')}</div>` : empty('💸', t('remit_none'))}`;

        { k: 'ref', label: t('group'), type: 'pills', opts: XN.GROUPS.map((x) => ({ v: x, l: t('group_' + x) })), show: (v) => nl && v.kind === 'group' },

  UI.screens.limits = {
    scene: 'aurora', title: () => t('limits_title'),

        const name = l.kind === 'cat' ? (cm[l.ref] ? cm[l.ref].ico + ' ' + XN.catName(cm[l.ref]) : '?') : l.kind === 'group' ? t('group_' + l.ref) : t('lim_total');

          <div class="btn-row"><button class="btn btn-sm" data-act="goal-add" data-id="${gl.id}" data-sign="1">${UI.icon('plus', 16)} ${t('put_in')}</button><button class="btn btn-sm" data-act="goal-add" data-id="${gl.id}" data-sign="-1">− ${t('take_out')}</button></div></div>`;

        <div class="sec-h"><h3>${t('goals_title')}</h3></div>${s.goals.length ? s.goals.map(gr).join('') : empty('🎯', t('goals_none'))}${add(t('goal_new'), 'goal-new')}`;
    },
  };
  UI.acts['limit-new'] = () => UI.openLimit(null);
  UI.acts['limit-open'] = (a) => UI.openLimit(S.state.limits.find((l) => l.id === a.dataset.id));

      onSave: (v) => {
        const am = num(v.amount);
        if (!(am > 0)) return t('err_amount');
        if (sign < 0 && am > C.goalSaved(S.state, gl) + 0.01) return t('err_goal_out');
        S.goalTx(gl.id, sign * am, v.acc); return null;
      },
    });
  };

  /* ================= CAR: fines + repairs ================= */
  UI.openFine = (f) => {
    const nf = !f;
    UI.form({
      title: nf ? t('fine_new') : t('edit'),
      values: f ? { amount: f.amount, note: f.note || '', ts: dateStr(f.ts), due: dateStr(f.due) } : { amount: '', note: '', ts: dateStr(Date.now()), due: dateStr(U.addDays(Date.now(), 20)) },
      hint: nf ? t('fine_hint') : '',
      fields: [{ k: 'amount', label: t('amount') + ' ₽', type: 'num', ph: '0' }, { k: 'note', label: t('fine_note'), type: 'text' }, { k: 'ts', label: t('fine_date'), type: 'date' }, { k: 'due', label: t('fine_due'), type: 'date' }],
      onSave: (v) => {
        const am = num(v.amount);
        if (!(am > 0)) return t('err_amount');
        const d = { amount: am, note: v.note.trim(), ts: parseDate(v.ts) || Date.now(), due: parseDate(v.due), cur: 'RUB' };
        if (nf) S.addFine(d); else { Object.assign(f, d); S.commit(); } return null;
      },
      onDelete: nf ? null : () => S.deleteFine(f.id),
    });
  };
  UI.screens.car = {
    scene: 'road', title: () => t('car_title'),
    body: () => {
      const s = S.state, now = Date.now();
      const fines = s.fines.slice().sort((a, b) => (a.paid - b.paid) || ((a.due || a.ts) - (b.due || b.ts)));
      const rep = s.txs.filter((x) => x.type === 'expense' && x.cat === 'remont').sort((a, b) => b.ts - a.ts);
      const sumR = (l) => l.reduce((a, x) => a + x.rub, 0);
      const un = fines.filter((f) => !f.paid);
      const fr = (f) => {
        const left = f.due ? U.dayDiff(f.due, now) : null;
        const sub = f.paid ? t('paid_on', { d: U.fmtDate(f.paidTs || f.ts) }) : left == null ? U.fmtDate(f.ts) : left < 0 ? t('late_n', { n: -left }) : t('in_n', { n: left });
        return `<div class="row fine ${!f.paid && left != null && left < 0 ? 'late' : ''}"><button class="row-in" data-act="fine-edit" data-id="${f.id}"><span class="row-ico">${f.paid ? '✅' : '🚨'}</span><span class="row-m"><b>${esc(f.note || t('fine'))}</b><small>${sub}</small></span><span class="row-r"><b>${M(f.amount, f.cur)}</b></span></button>${f.paid ? '' : `<button class="btn btn-sm" data-act="fine-pay" data-id="${f.id}">${t('pay')}</button>`}</div>`;
      };
      const ms = rep.filter((x) => x.ts >= U.som(now) && x.ts < U.eom(now));
      return `<div class="card"><div class="metrics3"><div class="metric"><span class="lbl">${t('unpaid_fines')}</span><b class="neg">${M(un.reduce((a, f) => a + f.amount, 0))}</b><small>${un.length} ${t('pcs')}</small></div><div class="metric"><span class="lbl">${t('repair_month')}</span><b>${M(sumR(ms))}</b></div><div class="metric"><span class="lbl">${t('repair_all')}</span><b>${M(sumR(rep))}</b></div></div></div>
        <div class="sec-h"><h3>${t('fines_h')}</h3></div>${fines.length ? `<div class="card list">${fines.map(fr).join('')}</div>` : empty('✅', t('fines_none'))}${add(t('fine_new'), 'fine-new')}
        <div class="sec-h"><h3>${t('repairs_h')}</h3></div>${rep.length ? `<div class="card list">${rep.slice(0, 15).map((x) => UI.txRow(x, { date: true })).join('')}</div>` : empty('🔧', t('repairs_none'))}${add(t('repair_new'), 'repair-new')}`;
    },
  };

  UI.openRecurring = (r) => {

      title: nr ? t('rec_new') : t('edit'),
      values: r ? { name: r.name, type: r.type, cat: r.cat, amount: r.amount, cur: r.cur, period: r.period, day: r.day, mode: r.mode, active: r.active ? 'on' : 'off', acc: r.acc || S.defaultAcc('cash') }
        : { name: '', type: 'expense', cat: 'arenda', amount: '', cur: 'RUB', period: 'monthly', day: String(new Date().getDate()), mode: 'remind', active: 'on', acc: S.defaultAcc('cash') },
      onPick: (k, v, vals) => { if (k === 'type') { const c = s.cats.find((x) => x.type === v && !x.hidden); vals.cat = c ? c.id : ''; } if (k === 'period') vals.day = v === 'weekly' ? '0' : '1'; },
      fields: [
        { k: 'name', label: t('name'), type: 'text', ph: t('rec_ph') },
        { k: 'type', label: t('type'), type: 'pills', opts: [{ v: 'expense', l: t('expense') }, { v: 'income', l: t('income_t') }] },
        { k: 'cat', label: t('category'), type: 'chips', opts: s.cats.filter((c) => !c.hidden && c.type === 'expense').map((c) => ({ v: c.id, l: c.ico + ' ' + XN.catName(c) })), show: (v) => v.type === 'expense' },
        { k: 'cat', label: t('category'), type: 'chips', opts: s.cats.filter((c) => !c.hidden && c.type === 'income').map((c) => ({ v: c.id, l: c.ico + ' ' + XN.catName(c) })), show: (v) => v.type === 'income' },

        { k: 'day', label: t('day_wd'), type: 'pills', opts: XN.tl('wd_s').map((w, i) => ({ v: String(i), l: w })), show: (v) => v.period === 'weekly' },
        { k: 'day', label: t('day_m'), type: 'num', ph: '1–31', show: (v) => v.period === 'monthly' },
        { k: 'mode', label: t('mode'), type: 'pills', opts: [{ v: 'remind', l: t('m_remind') }, { v: 'auto', l: t('m_auto') }] },
        { k: 'acc', label: t('account'), type: 'pills', opts: S.visibleAccounts().map((x) => ({ v: x.id, l: x.ico + ' ' + x.name })) },
        { k: 'active', label: t('status'), type: 'pills', opts: [{ v: 'on', l: t('on') }, { v: 'off', l: t('off') }], show: () => !nr },
      ],

        if (nr) S.addRecurring(d); else S.editRecurring(r.id, d); return null;

      };

    },

  UI.acts['rec-new'] = () => UI.openRecurring(null);
  UI.acts['rec-open'] = (a) => UI.openRecurring(S.state.recurring.find((r) => r.id === a.dataset.id));

        { k: 'ico', label: t('icon'), type: 'emoji' }, { k: 'name', label: t('name'), type: 'text' },
        { k: 'group', label: t('group'), type: 'pills', opts: XN.GROUPS.map((x) => ({ v: x, l: t('group_' + x) })), show: (v) => (nc ? v.type === 'expense' : c.type === 'expense') },

  UI.screens.cats = {

    return UI.sheet({
      cls: 'pin', state: st,
      render: (sh) => `<div class="pin-box"><h3>${o.title}</h3><div class="dots">${[0, 1, 2, 3].map((i) => `<i class="${i < sh.st.v.length ? 'f' : ''}"></i>`).join('')}</div><div class="err">${esc(sh.st.err)}</div>

      on: {
        k: async (a, e, sh) => {
          const k = a.dataset.v;
          if (k === 'bs') sh.st.v = sh.st.v.slice(0, -1); else if (sh.st.v.length < 4) sh.st.v += k;
          sh.st.err = '';
          if (sh.st.v.length === 4) {
            const pin = sh.st.v; sh.update();
            const err = await o.onDone(pin, sh);
            if (err) { sh.st.v = ''; sh.st.err = err; UI.buzz(40); }
          }
          sh.update();
        },
      },
    });
  };
  UI.acts['set-pin'] = () => {
    const st = S.state.settings;
    const setNew = () => {
      let first = null;
      UI.pinPad({
        title: t('pin_new'),
        onDone: async (pin, sh) => {
          if (!first) { first = pin; sh.st.v = ''; sh.st.err = ''; sh.layer.el.querySelector('h3').textContent = t('pin_repeat'); return null; }
          if (pin !== first) { first = null; sh.layer.el.querySelector('h3').textContent = t('pin_new'); return t('pin_mismatch'); }
          const salt = U.uid('p');
          st.pinSalt = salt; st.pin = await hashPin(pin, salt); S.commit(); sh.close(); UI.toast(t('pin_set')); return null;
        },
      });
    };
    if (!st.pin) return setNew();
    UI.sheet({
      render: () => `<div class="sh-scroll"><h3>${t('pin')}</h3><p class="mut">${t('pin_note')}</p></div><div class="btn-row sh-foot"><button class="btn" data-s="chg">${t('pin_change')}</button><button class="btn btn-danger" data-s="off">${t('pin_remove')}</button></div>`,
      on: {
        chg: (a, e, sh) => { sh.close(); g.setTimeout(() => verify(setNew), 260); },
        off: (a, e, sh) => { sh.close(); g.setTimeout(() => verify(() => { st.pin = null; st.pinSalt = null; S.commit(); UI.toast(t('pin_off')); }), 260); },
      },
    });
    function verify(next) {
      UI.pinPad({ title: t('pin_enter'), onDone: async (pin, sh) => { if ((await hashPin(pin, st.pinSalt)) !== st.pin) return t('pin_wrong'); sh.close(); g.setTimeout(next, 260); return null; } });

    let v = '';
    const draw = (err) => {
      el.innerHTML = `<div class="lock-in"><div class="lock-ic">${UI.icon('lock', 34)}</div><h2>${t('pin_enter')}</h2><div class="dots">${[0, 1, 2, 3].map((i) => `<i class="${i < v.length ? 'f' : ''}"></i>`).join('')}</div><div class="err">${esc(err || '')}</div>

<script>
(function (g) {
  'use strict';
  const XN = g.XN, S = XN.store, UI = XN.UI, doc = g.document;
  let hiddenAt = 0, raf = 0;

  function boot() {
    S.load();
    XN.i18n.setLang(S.state.settings.lang);
    UI.mount();
    UI.applyTheme();
    S.processAuto(Date.now());
    UI.renderNav();
    UI.renderTab(false);
    UI.setScene(XN.SCENE_BY_TAB[UI.tab]);
    S.on(() => { if (raf) return; raf = g.requestAnimationFrame(() => { raf = 0; UI.refresh(); }); });
    S.on(() => { doc.documentElement.lang = XN.i18n.lang; });
    doc.documentElement.lang = XN.i18n.lang;

    UI.showLock();
    if (!S.state.settings.onboarded && !S.state.settings.pin) g.setTimeout(UI.openOnboarding, 400);
    if (S.corrupt) UI.toast(XN.t('corrupt_warn'), { ms: 8000 });

    doc.addEventListener('visibilitychange', () => {
      if (doc.hidden) { hiddenAt = Date.now(); S.flush(); }
      else {
        if (S.state.settings.pin && hiddenAt && Date.now() - hiddenAt > 60000) UI.showLock();
        if (S.processAuto(Date.now())) UI.refresh(); else UI.renderTab(false);
        UI.renderNav();
      }
    });
    g.addEventListener('pagehide', () => S.flush());

    try { if (g.navigator.storage && g.navigator.storage.persist) g.navigator.storage.persist(); } catch (e) { /* ignore */ }
    g.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); UI.installEvt = e; });
    g.addEventListener('appinstalled', () => { UI.installEvt = null; });

    if ('serviceWorker' in g.navigator && /^https?:$/.test(g.location.protocol)) {
      g.navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed' && g.navigator.serviceWorker.controller) UI.toast(XN.t('update_ready'), { label: XN.t('reload'), fn: () => g.location.reload(), ms: 12000 }); });
        });
      }).catch(() => { /* offline install not available */ });
    }
  }
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot); else boot();
