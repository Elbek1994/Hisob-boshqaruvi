<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xarajat nazorati</title>
<meta name="theme-color" content="#0a0d26">
<meta name="description" content="Taksi haydovchisi uchun shaxsiy xarajat va daromad hisobi">
<style>
:root{
  --ink:#eaf0ff;--mut:#9ba7d3;--acc:#5ee0b0;--acc2:#6aa0ff;--warn:#ffb86b;--bad:#ff6b7d;
  --card:rgba(20,27,70,.58);--card2:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16);
  --sheet:#11173f;--ov:linear-gradient(rgba(6,8,28,.38),rgba(6,8,28,.62));--shadow:0 10px 30px rgba(0,0,0,.35);
  --inp:rgba(255,255,255,.08);--navh:68px;--r:20px;color-scheme:dark;
}
:root[data-theme=light]{
  --ink:#172042;--mut:#5b6694;--acc:#0f9d72;--acc2:#3566d6;--warn:#c9741a;--bad:#d2364c;
  --card:rgba(255,255,255,.74);--card2:rgba(20,30,80,.06);--line:rgba(20,30,80,.1);--line2:rgba(20,30,80,.16);
  --sheet:#f4f6fd;--ov:linear-gradient(rgba(238,241,251,.78),rgba(238,241,251,.9));--shadow:0 10px 30px rgba(30,40,90,.18);
  --inp:rgba(20,30,80,.06);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070a22;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.pos{color:var(--acc)}.neg{color:var(--bad)}.mut{color:var(--mut);font-size:.85rem}.center{text-align:center}.pad-s{padding:4px 4px 10px}
b{font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}

/* ---------- background scenes ---------- */
#bg{position:fixed;inset:0;z-index:0;background:#070a22;overflow:hidden}
#bg::after{content:"";position:absolute;inset:0;background:var(--ov);pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;transform:scale(1.07);transition:opacity .8s ease,transform 1.4s ease}
.scene.on{opacity:1;transform:scale(1)}
.scene svg{width:100%;height:100%;display:block}
.scene.custom{background-size:cover;background-position:center}
.tw{animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.aur{position:absolute;inset:0;background:linear-gradient(#050719,#10173f 70%,#1a2457);overflow:hidden}
.aur i{position:absolute;width:80%;height:38%;border-radius:50%;filter:blur(50px);opacity:.55;mix-blend-mode:screen}
.aur .a1{left:-20%;top:14%;background:#2fe3b0;animation:drift 14s ease-in-out infinite alternate}
.aur .a2{right:-25%;top:28%;background:#5a7bff;animation:drift 18s ease-in-out infinite alternate-reverse}
.aur .a3{left:10%;top:44%;background:#b06bff;opacity:.35;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-8%,0) scale(1)}to{transform:translate(14%,10%) scale(1.25)}}

/* ---------- shell ---------- */
#view{position:fixed;inset:0 0 var(--navh) 0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top);overscroll-behavior:contain}
#view.slide-l{animation:sl .34s cubic-bezier(.2,.8,.2,1)}#view.slide-r{animation:sr .34s cubic-bezier(.2,.8,.2,1)}#view.fade{animation:fd .25s}
@keyframes sl{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.page{padding:14px 16px 28px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:6px}
.top h1{font-size:1.55rem;font-weight:750;letter-spacing:-.01em}
.top-r{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.icon-btn:disabled{opacity:.3}.icon-btn.on{background:var(--acc);color:#04251b}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:5;display:flex;align-items:stretch;background:var(--sheet);background:color-mix(in srgb,var(--sheet) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);transition:transform .3s}
.nav-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--mut);position:relative;transition:color .2s}
.nav-b.on{color:var(--acc)}.nav-b.on .ic{transform:translateY(-1px) scale(1.1)}.nav-b .ic{transition:transform .2s}
.nav-b .live-dot{position:absolute;top:10px;left:calc(50% + 8px)}
.nav-mic{flex:none;width:62px;height:62px;border-radius:50%;margin:-20px 6px 0;align-self:flex-start;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04141f;box-shadow:0 8px 24px rgba(94,224,176,.4);border:4px solid var(--sheet)}
.nav-mic:active{transform:scale(.94)}
body.has-screen #nav,body.locked #nav{transform:translateY(120%)}
body.has-screen #view{visibility:hidden}
body.has-sheet{overflow:hidden}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card.list{padding:4px 6px}.card.list.tight{padding:2px 4px}
.card.empty{text-align:center;color:var(--mut);padding:22px 16px}.empty-i{font-size:2rem;margin-bottom:6px}
.card.m{padding:12px}.card.accent{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.lbl{display:block;font-size:.76rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc2) 30%,var(--card)),var(--card))}
.hero.single{flex-direction:column;align-items:flex-start}
.hero .big{display:block;font-size:2.15rem;font-weight:780;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.hero .sub{font-size:.82rem;color:var(--mut)}
.hero-r{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.metrics3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric b{display:block;font-size:1.02rem;font-weight:700}.metric small{display:block;font-size:.72rem;color:var(--mut)}.metric small.pos{color:var(--acc)}.metric small.neg{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem;margin-top:8px}
.kv span{color:var(--mut)}.kv.total{font-weight:700}.kv.total span{color:var(--ink)}
.sumbar{border:0;margin:0;padding:2px 4px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px 0}
.sec-h h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700}
.link{color:var(--acc2);font-size:.88rem;padding:6px 4px}

/* ---------- rows ---------- */
.row{width:100%;display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:14px;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
button.row:active{background:var(--card2)}
.row-ico{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:1.3rem;flex:none}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-m b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-m small,.row-r small{color:var(--mut);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;flex:none;max-width:42%}
.row-r b{font-weight:700}.row.off{opacity:.5}
.row-in{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.row.rem.late .row-m small{color:var(--bad)}.row.rem.now .row-m small{color:var(--warn)}.row.fine.late .row-m small{color:var(--bad)}
.day-h{display:flex;justify-content:space-between;padding:10px 6px 0;font-size:.82rem;color:var(--mut)}

/* ---------- buttons ---------- */
.btn{min-height:46px;padding:10px 16px;border-radius:15px;background:var(--card2);border:1px solid var(--line2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:12px}
.btn-primary{background:linear-gradient(135deg,var(--acc),#3fc7e0);color:#04251b;border:0}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn-stop{background:linear-gradient(135deg,#ff6b7d,#ff9a6a);color:#2a0710;border:0}
.btn.big{min-height:54px;font-size:1.05rem;flex:1}
.btn-row{display:flex;gap:10px}.btn-row .btn{flex:1}
.fab-row{width:100%;min-height:50px}
.banner{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);width:100%}
.banner span{flex:1;font-weight:600}.banner.start{color:var(--acc)}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(255,107,125,.7);animation:pulse 1.6s infinite;display:inline-block;flex:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,107,125,0)}100%{box-shadow:0 0 0 0 rgba(255,107,125,0)}}

/* ---------- quick, chips, pills ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);min-height:74px;transition:transform .12s}
.qk:active{transform:scale(.95)}.qe{font-size:1.5rem}.qn{font-size:.7rem;color:var(--mut);text-align:center;line-height:1.15;max-height:2.3em;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.9rem;min-height:40px}
.chip.sel{background:var(--acc);color:#04251b;border-color:transparent;font-weight:650}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pills.center{justify-content:center}
.pill{padding:9px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.9rem;min-height:40px;display:inline-flex;align-items:center}
.pill.sm{padding:6px 11px;min-height:34px;font-size:.84rem}.pill.sel{background:var(--acc2);color:#fff;border-color:transparent;font-weight:650}.pill.dis{opacity:.35;pointer-events:none}

/* ---------- tips ---------- */
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc2);backdrop-filter:blur(12px)}
.tip.good{border-left-color:var(--acc)}.tip.warn{border-left-color:var(--warn)}.tip.bad{border-left-color:var(--bad)}
.tip-i{font-size:1.25rem}.tip p{font-size:.92rem}

/* ---------- shift ---------- */
.card.live{text-align:center;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card))}
.timer{font-size:2.8rem;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.orders{display:flex;align-items:center;justify-content:center;gap:20px}.orders div{display:flex;flex-direction:column;min-width:80px}.orders b{font-size:1.7rem}.orders span{font-size:.75rem;color:var(--mut)}
.round{width:52px;height:52px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);font-size:1.6rem;display:grid;place-items:center;text-align:center}.round.plus{background:var(--acc);color:#04251b;border:0}
.round:active{transform:scale(.92)}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.be-t{display:flex;justify-content:space-between}.goalrow{display:flex;gap:14px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.field,.inp{display:block;position:relative}
.field input,.inp input{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;background:var(--inp);border:1px solid var(--line);outline:0;font-size:1.05rem}
.field em{position:absolute;right:14px;bottom:14px;font-style:normal;color:var(--mut)}
.inp input:focus,.field input:focus,.search input:focus{border-color:var(--acc2)}
.field{margin:12px 0}

/* ---------- report ---------- */
.monthnav{display:flex;align-items:center;justify-content:space-between}.monthnav b{font-size:1.05rem}
.donut-card{display:flex;align-items:center;gap:16px}.donut{flex:none}.d-sub{fill:var(--mut);font-size:11px}.d-main{fill:var(--ink);font-size:15px;font-weight:700}
.legend{flex:1;display:flex;flex-direction:column;gap:8px}.lg{display:flex;align-items:center;gap:8px;font-size:.88rem}.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg span{flex:1;color:var(--mut)}
.hb+.hb{margin-top:12px}.hb-top{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}.hb-v{font-weight:650}.hb-bar{height:8px;border-radius:99px;background:var(--line2);margin-top:5px;overflow:hidden}.hb-bar i{display:block;height:100%;border-radius:99px}
.wdc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px}.wdc-c{display:flex;flex-direction:column;align-items:center;gap:4px}.wdc-b{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wdc-b i{width:70%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--acc2);display:block;min-height:4px}.wdc-b i.best{background:var(--acc)}.wdc-b i.neg{background:var(--bad)}.wdc-b i.none{background:var(--line2)}
.wdc-v{font-size:.62rem;color:var(--mut);height:12px}.wdc-n{font-size:.72rem;color:var(--mut)}
.spark{width:100%;height:80px;display:block}.empty-chart{text-align:center;color:var(--mut);padding:18px 0;font-size:.9rem}
.ring-t{fill:var(--ink);font-size:.8rem;font-weight:700}.ring-v{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
small.pos{color:var(--acc)}small.neg{color:var(--bad)}.warn{color:var(--warn)}

/* ---------- screens ---------- */
.layer{position:fixed;inset:0;z-index:30}
.screen-layer{display:flex;flex-direction:column;background:var(--ov);backdrop-filter:blur(3px);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.screen-layer.open{transform:none}.screen-layer.closing{transform:translateX(100%)}
.s-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.s-head h2{flex:1;font-size:1.2rem;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-scroll{flex:1;overflow-y:auto;padding:6px 16px 36px;display:flex;flex-direction:column;gap:12px;max-width:640px;width:100%;margin:0 auto;overscroll-behavior:contain}
.h-ctl{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;background:var(--inp);border:1px solid var(--line);color:var(--mut)}
.search input{flex:1;min-height:48px;border:0;background:none;outline:0;color:var(--ink);min-width:0}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-h span{text-align:center;font-size:.7rem;color:var(--mut)}.cal-g{margin-top:6px}
.cal-d,.cal-e{min-height:46px;border-radius:10px}.cal-d{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card2);font-size:.82rem;gap:0}
.cal-d small{font-size:.58rem}.cal-d.up small{color:var(--acc)}.cal-d.dn small{color:var(--bad)}.cal-d.sel{outline:2px solid var(--acc2)}
.goal{display:flex;flex-direction:column;gap:10px}.goal-t{display:flex;align-items:center;gap:12px;width:100%}
.set-r{padding:6px 0}.set-r+.set-r{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}.set-r .pills{margin-top:6px}.set-r .btn-row{margin-top:8px}

/* ---------- sheets ---------- */
.sheet-layer{display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet-layer.dialog{align-items:center;z-index:60}
.backdrop{position:absolute;inset:0;background:rgba(3,5,20,.55);opacity:0;transition:opacity .25s}.open>.backdrop{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;max-height:94vh;max-height:94dvh;background:var(--sheet);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.open>.sheet{transform:none}.closing>.sheet{transform:translateY(105%)}.closing>.backdrop{opacity:0}
.dialog .sheet{border-radius:22px;width:calc(100% - 40px);max-width:380px;transform:scale(.92);opacity:0;border-bottom:1px solid var(--line);transition:transform .2s,opacity .2s}.dialog.open .sheet{transform:none;opacity:1}.dialog.closing .sheet{opacity:0}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:9px auto 2px;flex:none}
.sh-body{display:flex;flex-direction:column;min-height:0;flex:1}
.sh-scroll{overflow-y:auto;padding:8px 18px 12px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1;overscroll-behavior:contain}
.sh-scroll h3{font-size:1.15rem}.sh-foot{padding:10px 16px 14px;flex:none}
.dlg{padding:22px 20px 18px;display:flex;flex-direction:column;gap:10px}.dlg-btns{display:flex;gap:10px;margin-top:8px}.dlg-btns .btn{flex:1}
.fld{display:flex;flex-direction:column;gap:2px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp input[type=datetime-local],.inp input[type=date]{min-width:0;font-size:.95rem;padding:12px 8px}
.err{color:var(--bad);font-size:.86rem;min-height:1.1em}.hint{color:var(--mut);font-size:.85rem}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card2);padding:4px;border-radius:15px}
.seg{padding:10px 2px;border-radius:11px;text-align:center;font-size:.85rem;font-weight:600;color:var(--mut);min-height:42px}.seg.on{background:var(--sheet);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.amt-box{text-align:center;padding:4px 0}.amt-v{font-size:2.6rem;font-weight:780;letter-spacing:-.02em;word-break:break-all;font-variant-numeric:tabular-nums}.amt-v em{font-style:normal;font-size:1.3rem;color:var(--mut);margin-left:6px}
.amt-box.pos .amt-v{color:var(--acc)}.amt-box.neg .amt-v{color:var(--bad)}.amt-box small{color:var(--mut)}
.pills.cur{justify-content:center}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 14px 0;flex:none}
.key{min-height:50px;border-radius:14px;background:var(--card2);font-size:1.35rem;font-weight:600;text-align:center;display:grid;place-items:center}.key:active{background:var(--line2);transform:scale(.96)}.key.op{color:var(--acc2)}
.add .pad .key{min-height:46px}
@media (max-height:700px){.add .pad{gap:5px}.add .pad .key{min-height:38px;font-size:1.15rem}.add .amt-v{font-size:2rem}.add .sh-scroll{gap:8px}.add .sh-foot{padding:8px 16px 10px}.add .btn.big{min-height:46px}}
.pin-pad{grid-template-columns:repeat(3,1fr);max-width:300px;margin:12px auto 0;padding:0}.pin-pad .key{min-height:58px}
.pin-box{padding:18px 20px 26px;text-align:center}.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 6px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--acc);border-color:var(--acc)}
#lock{position:fixed;inset:0;z-index:100;background:var(--sheet);display:grid;place-items:center}#lock[hidden]{display:none}.lock-in{text-align:center;padding:20px;width:100%;max-width:360px}.lock-ic{color:var(--acc);display:grid;place-items:center;margin-bottom:10px}
.onb-h{font-size:3rem;text-align:center}.sheet.onb .sh-scroll{text-align:left}
.vc{align-items:stretch}.mic-big{width:96px;height:96px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04141f;box-shadow:0 10px 30px rgba(94,224,176,.35)}
.mic-big.on{animation:micp 1.2s infinite;background:linear-gradient(135deg,#ff6b7d,#ff9a6a)}@keyframes micp{50%{transform:scale(1.08)}}
.vc>.mut{text-align:center}.v-live{text-align:center;min-height:1.5em;font-size:1.1rem}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:#1d2557;color:#fff;box-shadow:var(--shadow);max-width:480px;font-size:.92rem;animation:tin .25s}
:root[data-theme=light] .toast{background:#172042}.toast button{color:var(--acc);font-weight:700;padding:4px}.toast.out{opacity:0;transform:translateY(10px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(14px)}}
body.has-screen #toasts,body.has-sheet #toasts{bottom:calc(20px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:700px){body{font-size:17px}}
.goalrow>div{display:flex;flex-direction:column}.goalrow small{display:block}
body.has-screen #toasts,body.has-sheet #toasts{bottom:auto;top:calc(12px + env(safe-area-inset-top));flex-direction:column-reverse}
.evening{display:flex;flex-direction:column;gap:8px;border-color:color-mix(in srgb,var(--warn) 55%,transparent)}

<script>
(function (g) {
  'use strict';
  const XN = (g.XN = g.XN || {});
  const U = (XN.U = {});

  /* ---------- i18n core ---------- */
  XN.i18n = {
    lang: 'uz',
    dict: { uz: {}, ru: {} },
    add(l, o) { Object.assign(this.dict[l], o); },
    t(k, v) {
      let s = this.dict[this.lang][k];
      if (s == null) s = this.dict.uz[k];
      if (s == null) return k;
      if (v) s = s.replace(/\{(\w+)\}/g, (m, n) => (v[n] != null ? v[n] : m));
      return s;
    },
    setLang(l) { this.lang = l === 'ru' ? 'ru' : 'uz'; },
  };
  XN.t = (k, v) => XN.i18n.t(k, v);
  XN.tl = (k) => XN.i18n.t(k).split('|');

  /* ---------- basics ---------- */
  const p2 = (n) => (n < 10 ? '0' : '') + n;
  U.p2 = p2;
  U.uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  U.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  U.clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  /* ---------- numbers & money ---------- */
  U.fmtNum = (n, dec) => {
    if (dec == null) dec = 2;
    if (n == null || isNaN(n)) return '0';
    const neg = n < 0;
    n = Math.abs(n);
    const k = Math.pow(10, dec);
    const s = (Math.round(n * k) / k).toFixed(dec);
    let [i, f] = s.split('.');
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    if (f) f = f.replace(/0+$/, '');
    return (neg && (+i.replace(/\D/g, '') > 0 || f) ? '−' : '') + i + (f ? ',' + f : '');
  };
  XN.curSym = (cur) => (cur === 'RUB' ? '₽' : cur === 'USD' ? '$' : XN.i18n.lang === 'ru' ? 'сум' : "so'm");
  U.money = (n, cur, o) => {
    cur = cur || 'RUB';
    o = o || {};
    const dec = o.dec != null ? o.dec : cur === 'USD' ? 2 : 0;
    const rounded = Math.round(Math.abs(n) * Math.pow(10, dec));
    const s = U.fmtNum(Math.abs(n), dec);
    const sign = n < 0 && rounded > 0 ? '−' : o.plus && n > 0 ? '+' : '';
    const sym = XN.curSym(cur);
    return cur === 'USD' ? sign + '$ ' + s : sign + s + ' ' + sym;
  };

  /* ---------- dates ---------- */
  U.sod = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
  U.addDays = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); };
  U.som = (ts) => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
  U.addMonths = (ts, n) => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth() + n, 1).getTime(); };
  U.eom = (ts) => U.addMonths(ts, 1); // exclusive end of month
  U.dim = (ts) => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
  U.monthDay = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate())).getTime();
  U.dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
  U.weekStart = (ts) => { const s = U.sod(ts); return U.addDays(s, -((new Date(s).getDay() + 6) % 7)); };
  U.dayDiff = (a, b) => Math.round((U.sod(a) - U.sod(b)) / 864e5);
  U.wd = (ts) => (new Date(ts).getDay() + 6) % 7; // Mon=0
  U.toLocalInput = (ts) => {
    const d = new Date(ts);
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  };
  U.fromLocalInput = (s) => { const t = new Date(s).getTime(); return isNaN(t) ? null : t; };
  U.toDateInput = (ts) => U.toLocalInput(ts).slice(0, 10);
  U.fromDateInput = (s) => { const t = new Date(s + 'T00:00').getTime(); return isNaN(t) ? null : t; };
  U.fmtTime = (ts) => { const d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
  U.monthName = (ts) => XN.tl('months')[new Date(ts).getMonth()];
  U.fmtDate = (ts) => { const d = new Date(ts); return d.getDate() + ' ' + XN.tl('months_g')[d.getMonth()]; };
  U.fmtDateFull = (ts) => U.fmtDate(ts) + ' ' + new Date(ts).getFullYear();
  U.fmtDayLabel = (ts, now) => {
    const diff = U.dayDiff(now || Date.now(), ts);
    if (diff === 0) return XN.t('today');
    if (diff === 1) return XN.t('yesterday');
    return XN.tl('wd')[(new Date(ts).getDay() + 6) % 7] + ', ' + U.fmtDate(ts);
  };
  U.fmtDur = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return p2(Math.floor(s / 3600)) + ':' + p2(Math.floor((s % 3600) / 60)) + ':' + p2(s % 60);
  };
  U.fmtHours = (ms) => {
    const m = Math.round(Math.max(0, ms) / 60000);
    const h = Math.floor(m / 60);
    return h > 0 ? XN.t('dur_hm', { h, m: m % 60 }) : XN.t('dur_m', { m });
  };

  /* ---------- arithmetic for the keypad (no eval) ---------- */
  U.evalExpr = (str) => {
    if (str == null) return null;
    const s = String(str).replace(/\s+/g, '').replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    if (!s || !/^[0-9+\-*/.]+$/.test(s)) return null;
    const tokens = s.match(/(\d+\.?\d*|\.\d+|[+\-*/])/g);
    if (!tokens || tokens.join('') !== s) return null;
    let i = 0;
    const num = () => {
      let sign = 1;
      while (tokens[i] === '-' || tokens[i] === '+') { if (tokens[i] === '-') sign = -sign; i++; }
      const t = tokens[i++];
      if (t === undefined || /^[+\-*/]$/.test(t)) throw new Error('x');
      return sign * parseFloat(t);
    };
    const term = () => {
      let v = num();
      while (tokens[i] === '*' || tokens[i] === '/') { const op = tokens[i++]; const r = num(); v = op === '*' ? v * r : v / r; }
      return v;
    };
    const expr = () => {
      let v = term();
      while (tokens[i] === '+' || tokens[i] === '-') { const op = tokens[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
      return v;
    };
    try {
      const v = expr();
      if (i !== tokens.length || !isFinite(v)) return null;
      return U.round2(v);
    } catch (e) { return null; }
  };

  /* ---------- hashing for the PIN ---------- */
  U.sha = async (s) => {
    try {
      if (g.crypto && g.crypto.subtle) {
        const b = await g.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
        return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* fall through */ }
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'f' + (h >>> 0).toString(16);
  };

  U.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  /* ---------- tiny seeded RNG (demo data, scenes) ---------- */
  U.rng = (seed) => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };

  /* ---------- shared strings ---------- */
  XN.i18n.add('uz', {
    today: 'Bugun', yesterday: 'Kecha',
    months: 'Yanvar|Fevral|Mart|Aprel|May|Iyun|Iyul|Avgust|Sentabr|Oktabr|Noyabr|Dekabr',
    months_g: 'yanvar|fevral|mart|aprel|may|iyun|iyul|avgust|sentabr|oktabr|noyabr|dekabr',
    wd: 'Dushanba|Seshanba|Chorshanba|Payshanba|Juma|Shanba|Yakshanba',
    wd_s: 'Du|Se|Ch|Pa|Ju|Sh|Ya',
    dur_hm: '{h} soat {m} daq', dur_m: '{m} daq',
  });
  XN.i18n.add('ru', {
    today: 'Сегодня', yesterday: 'Вчера',
    months: 'Январь|Февраль|Март|Апрель|Май|Июнь|Июль|Август|Сентябрь|Октябрь|Ноябрь|Декабрь',
    months_g: 'января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря',
    wd: 'Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье',
    wd_s: 'Пн|Вт|Ср|Чт|Пт|Сб|Вс',
    dur_hm: '{h} ч {m} мин', dur_m: '{m} мин',
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = XN;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function (g) {
  'use strict';
  const XN = (g.XN = g.XN || {});
  const U = XN.U;
  const C = (XN.calc = {});

  /* ---------- currency ---------- */
  C.rubPer = (s) => {
    const usd = +s.settings.usdRub || 1;
    const uzs = +s.settings.usdUzs || 1;
    return { RUB: 1, USD: usd, UZS: usd / uzs };
  };
  C.conv = (a, from, to, s) => {
    if (from === to) return a;
    const r = C.rubPer(s);
    return (a * r[from]) / r[to];
  };

  /* ---------- period summary ---------- */

    for (const t of s.txs) {
      if (t.type !== 'expense' || t.ts < from || t.ts >= to) continue;

    }

  };

      else { red += t.amount; if (t.ts >= m0 && t.ts < m1) paidMonth += t.amount; }
    }

    const remaining = Math.max(0, total - red);

  };

  // first occurrence on/after `from`
  C.firstOccurrence = (r, from) => {

    }

    for (const f of s.fines) {
      if (f.paid || !f.due) continue;
      const days = U.dayDiff(f.due, now);
      if (days <= lead) out.push({ kind: 'fine', id: f.id, title: f.note || XN.t('fine'), amount: f.amount, cur: f.cur || 'RUB', daysLeft: days, due: f.due });
    }
    return out.sort((a, b) => a.daysLeft - b.daysLeft);
  };

  XN.i18n.add('ru', { fine: 'Штраф' });

  S.exportCSV = (from, to) => {

    const today0 = U.sod(now);
    for (let back = 35; back >= 0; back--) {

      const wd = U.wd(day0);
      if (wd === 1 && back > 0) continue; // a day off
      const start = day0 + (7 + Math.floor(rnd() * 3)) * 3600000;
      let hours = 8 + rnd() * 3;
      const isToday = back === 0;
      let end = start + hours * 3600000;
      if (isToday) { end = null; hours = Math.max(1, (now - start) / 3600000); if (now < start + 3600000) continue; }
      const sh = mark({ id: U.uid('s'), start, end, tariff: tar[Math.floor(rnd() * tar.length)], orders: Math.round(hours * (2.2 + rnd())), km: Math.round(hours * (18 + rnd() * 6)), note: '' });
      st.shifts.push(sh);

      st.txs.push(S.normalizeTx(mark({ type: 'income', cat: 'karta', amount: cardPart, cur: 'RUB', acc: card, ts: t1, shiftId: sh.id })));
      if (rnd() > 0.5) st.txs.push(S.normalizeTx(mark({ type: 'income', cat: 'bonus', amount: Math.round(rnd() * 6) * 100, cur: 'RUB', acc: card, ts: t1, shiftId: sh.id })));
      st.txs.push(S.normalizeTx(mark({ type: 'expense', cat: rnd() > 0.3 ? 'benzin' : 'gaz', amount: Math.round((hours * (95 + rnd() * 40)) / 10) * 10, cur: 'RUB', acc: card, ts: start + 3 * 3600000, shiftId: sh.id })));
      if (rnd() > 0.55) st.txs.push(S.normalizeTx(mark({ type: 'expense', cat: 'moyka', amount: 600 + Math.round(rnd() * 4) * 50, cur: 'RUB', acc: cash, ts: start + 5 * 3600000, shiftId: sh.id })));
      if (rnd() > 0.7) st.txs.push(S.normalizeTx(mark({ type: 'expense', cat: 'parkovka', amount: 100 + Math.round(rnd() * 6) * 50, cur: 'RUB', acc: cash, ts: start + 2 * 3600000, shiftId: sh.id })));
      if (rnd() > 0.5) st.txs.push(S.normalizeTx(mark({ type: 'expense', cat: 'ovqat', amount: 300 + Math.round(rnd() * 6) * 50, cur: 'RUB', acc: cash, ts: start + 4 * 3600000 })));
      if (wd === 5) st.txs.push(S.normalizeTx(mark({ type: 'expense', cat: 'oilam', amount: 4000 + Math.round(rnd() * 5) * 500, cur: 'RUB', acc: card, ts: start + 9 * 3600000 })));
    }
    const m0 = U.som(now);
    st.txs.push(S.normalizeTx(mark({ type: 'remit', usd: 150, rate: st.settings.usdRub, acc: card, ts: Math.min(now - 3600000, U.addDays(m0, 5) + 15 * 3600000), note: '' })));
    st.txs.push(S.normalizeTx(mark({ type: 'expense', cat: 'patent', amount: 7000, cur: 'RUB', acc: card, ts: U.addDays(m0, 2) + 36000000 })));
    st.txs.push(S.normalizeTx(mark({ type: 'expense', cat: 'remont', amount: 4200, cur: 'RUB', acc: card, ts: U.addDays(now, -6) })));
    const d1 = mark({ id: U.uid('d'), kind: 'credit', name: 'Kredit Korona', cur: 'RUB', principal: 60000, monthly: 6000, dueDay: new Date(now).getDate() + 2 > 28 ? 28 : new Date(now).getDate() + 2, due: null, closed: false, note: '', ts: now });
    const d2 = mark({ id: U.uid('d'), kind: 'credit', name: 'Kredit M Bulok', cur: 'RUB', principal: 30000, monthly: 3500, dueDay: 25, due: null, closed: false, note: '', ts: now });
    const d3 = mark({ id: U.uid('d'), kind: 'owed', name: 'Akmal', cur: 'RUB', principal: 2000, monthly: 0, dueDay: 0, due: null, closed: false, note: '', ts: now });
    st.debts.push(d1, d2, d3);
    st.txs.push(S.normalizeTx(mark({ type: 'debt', debtId: d1.id, op: 'pay', amount: 18000, cur: 'RUB', acc: card, ts: U.addDays(now, -40) })));
    st.txs.push(S.normalizeTx(mark({ type: 'debt', debtId: d2.id, op: 'pay', amount: 9500, cur: 'RUB', acc: card, ts: U.addDays(now, -30) })));
    st.limits.push(mark({ id: U.uid('l'), kind: 'cat', ref: 'benzin', amount: 20000 }));
    st.limits.push(mark({ id: U.uid('l'), kind: 'cat', ref: 'oilam', amount: 25000 }));
    const goal = mark({ id: U.uid('g'), name: "Ta'til", target: 120000, ico: '🏖️', deadline: null });
    st.goals.push(goal);
    st.txs.push(S.normalizeTx(mark({ type: 'goal', goalId: goal.id, amount: 35000, cur: 'RUB', acc: '', ts: U.addDays(now, -9) })));
    st.fines.push(mark({ id: U.uid('f'), amount: 500, cur: 'RUB', ts: U.addDays(now, -3), due: U.addDays(U.sod(now), 2), note: 'ГИБДД', paid: false }));
    st.recurring.push(mark({ id: U.uid('r'), name: 'Patent', type: 'expense', cat: 'patent', amount: 7000, cur: 'RUB', acc: card, period: 'monthly', day: 2, active: true, mode: 'remind', next: C.firstOccurrence({ period: 'monthly', day: 2 }, now) }));
    st.accounts.forEach((a) => { if (a.kind === 'cash' && !a.open) a.open = 3000; if (a.kind === 'card' && !a.open) a.open = 12000; if (a.cur === 'USD' && !a.open) a.open = 420; });

  };

  if (typeof module !== 'undefined' && module.exports) module.exports = XN;

<script>
(function (g) {
  'use strict';
  const XN = (g.XN = g.XN || {});
  const U = XN.U, C = XN.calc;
  const A = (XN.advisor = {});

  /* Rule-based advice. Everything is computed on the phone from the user's own numbers:
     no network, nothing leaves the device. Each tip: { id, level, ico, key, vars, prio }. */
  A.tips = (s, now) => {
    now = now || Date.now();
    const out = [];
    const M = (n) => U.money(n, 'RUB');
    const cm = XN.catMap(s);
    const set = s.settings;
    const [d0, d1] = C.dayRange(now);
    const day = C.summary(s, d0, d1);
    const sh = C.activeShift(s);
    const goal = +set.dailyGoal || 0;
    const mon = C.monthSummary(s, now);
    const push = (id, level, ico, key, vars, prio) => out.push({ id, level, ico, key, vars: vars || {}, prio });

    /* 1. today: goal, pace, break-even */
    if (sh) {
      const st = C.shiftStats(s, sh, now);
      if (st.net < 0 && st.hours >= 0.1) push('be', 'warn', '⚠️', 'tip_breakeven', { n: M(-st.net) }, 90);
    }
    if (goal > 0) {
      const rem = goal - day.net;
      if (day.income > 0 && rem <= 0) push('goal', 'good', '🎉', 'tip_goal_done', { extra: M(-rem) }, 70);
      else if (sh) {
        const st = C.shiftStats(s, sh, now);
        if (rem > 0 && st.perHour > 0 && st.hours >= 0.5) push('goal', 'info', '🎯', 'tip_goal_pace', { rem: M(rem), h: (Math.round((rem / st.perHour) * 10) / 10).toString().replace('.', ',') }, 72);
        else if (rem > 0) push('goal', 'info', '🎯', 'tip_goal_left', { rem: M(rem) }, 68);
      } else if (day.income === 0 && s.txs.length > 0) push('start', 'info', '🚕', 'tip_start_shift', {}, 40);
      else if (rem > 0 && day.income > 0) push('goal', 'info', '🎯', 'tip_goal_left', { rem: M(rem) }, 66);
    }

    /* 2. fuel */
    const fuel = (mon.byCat.benzin || 0) + (mon.byCat.gaz || 0);
    if (mon.income >= 5000 && fuel / mon.income > 0.3) push('fuel', 'warn', '⛽', 'tip_fuel_share', { p: Math.round((fuel / mon.income) * 100) }, 62);
    const w0 = U.weekStart(now), span = U.sod(now) + 864e5 - w0;
    const f = (a, b) => { const r = C.summary(s, a, b); return (r.byCat.benzin || 0) + (r.byCat.gaz || 0); };
    const fThis = f(w0, w0 + span), fLast = f(w0 - 7 * 864e5, w0 - 7 * 864e5 + span);
    if (fLast > 0 && fThis > fLast * 1.3 && fThis - fLast >= 500) push('fuelw', 'warn', '⛽', 'tip_fuel_week', { p: Math.round((fThis / fLast - 1) * 100) }, 60);

    /* 3. limits */
    const dom = new Date(now).getDate();
    s.limits.forEach((l) => {
      const ls = C.limitStatus(s, l, now);
      const name = l.kind === 'cat' ? XN.catName(cm[l.ref]) : l.kind === 'group' ? XN.t('group_' + l.ref) : XN.t('lim_total');
      const vars = { name, spent: M(ls.spent), limit: M(l.amount), p: Math.round(ls.pct * 100), proj: M(ls.proj) };
      if (ls.over) push('lim' + l.id, 'bad', '🚨', 'tip_limit_over', vars, 85);
      else if (ls.pct >= 0.8) push('lim' + l.id, 'warn', '📊', 'tip_limit_80', vars, 65);
      else if (dom >= 5 && ls.willOver) push('lim' + l.id, 'warn', '📈', 'tip_limit_proj', vars, 55);
    });

    /* 4. weekdays */
    const ws = C.weekdayStats(s, now, 8);
    const tn = ws.reduce((a, w) => a + w.n, 0), ts = ws.reduce((a, w) => a + w.sum, 0);
    if (tn >= 10 && ts > 0) {
      const all = ts / tn;
      let lo = -1, hi = -1;
      ws.forEach((w, i) => { if (w.n >= 3) { if (lo < 0 || w.avg < ws[lo].avg) lo = i; if (hi < 0 || w.avg > ws[hi].avg) hi = i; } });
      const wdn = XN.tl('wd');
      if (lo >= 0 && ws[lo].avg < all * 0.7) push('wdlo', 'info', '📉', 'tip_wd_low', { wd: wdn[lo], avg: M(ws[lo].avg), all: M(all) }, 45);
      if (hi >= 0 && ws[hi].avg > all * 1.15) push('wdhi', 'good', '📈', 'tip_wd_best', { wd: wdn[hi], avg: M(ws[hi].avg) }, 44);
    }

    /* 5. due dates */
    C.reminders(s, now).forEach((r) => {
      const vars = { title: r.title, n: Math.abs(r.daysLeft), sum: U.money(r.amount, r.cur) };
      if (r.daysLeft < 0) push('due' + r.id, 'bad', '⏰', 'tip_due_late', vars, 95);
      else if (r.daysLeft === 0) push('due' + r.id, 'warn', '⏰', 'tip_due_today', vars, 80);
      else push('due' + r.id, 'info', '🗓️', 'tip_due_soon', vars, 58);
    });

    /* 6. this month vs the same stretch of last month */
    if (dom >= 7) {
      const pm = U.addMonths(now, -1), a = U.som(pm);
      const pr = C.summary(s, a, Math.min(U.eom(pm), U.addDays(a, dom)));
      if (pr.income > 0 && mon.income > 0) {
        const diff = mon.income / pr.income - 1;
        if (Math.abs(diff) >= 0.1) push('mom', diff > 0 ? 'good' : 'info', diff > 0 ? '👍' : '📉', diff > 0 ? 'tip_month_up' : 'tip_month_down', { p: Math.round(Math.abs(diff) * 100) }, 30);
      }
    }

    /* 7. tariff comparison (last 30 days) */
    const tstat = C.tariffStats(s, U.addDays(now, -30), now + 1);
    const tk = Object.keys(tstat).filter((k) => tstat[k].hours >= 10);
    if (tk.length >= 2) {
      tk.sort((a, b) => tstat[b].perHour - tstat[a].perHour);
      const b = tk[0], w = tk[tk.length - 1];
      if (tstat[w].perHour > 0 && tstat[b].perHour > tstat[w].perHour * 1.15) push('tar', 'info', '🚖', 'tip_tariff', { best: XN.t('tariff_' + b), h1: M(tstat[b].perHour), worst: XN.t('tariff_' + w), h2: M(tstat[w].perHour) }, 25);
    }

    /* 8. housekeeping */
    if (s.txs.length >= 10 && (!set.lastBackup || now - set.lastBackup > 14 * 864e5)) push('bak', 'info', '💾', 'tip_backup', {}, 50);
    if (set.autoRent && !(+set.rent > 0) && s.shifts.length > 0) push('rent', 'info', '🚕', 'tip_rent', {}, 35);
    if (s.txs.length === 0) push('empty', 'info', '✨', 'tip_empty', {}, 20);

    return out.sort((a, b) => b.prio - a.prio);
  };

    tip_limit_80: '«{name}»: использовано {p}% лимита ({spent} / {limit}).',

      : `<button class="nav-b${UI.tab === x.id ? ' on' : ''}" data-act="tab" data-tab="${x.id}">${UI.icon(x.ico)}<span>${esc(t(x.label))}</span>${x.id === 'shift' && sh ? '<i class="live-dot"></i>' : ''}</button>`).join('');
  };
  UI.renderTab = (anim) => {
    const v = UI.el.view, top = v.scrollTop;
    v.innerHTML = UI.pages[UI.tab]();
    if (anim) { v.classList.remove('slide-l', 'slide-r', 'fade'); void v.offsetWidth; v.classList.add(anim); v.scrollTop = 0; } else v.scrollTop = top;
    UI.after(v);
  };
  UI.go = (tab, anim) => {
    if (UI.layers.length) return;
    if (tab === UI.tab) { UI.el.view.scrollTo && UI.el.view.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const dir = anim || (ORDER.indexOf(tab) > ORDER.indexOf(UI.tab) ? 'slide-l' : 'slide-r');
    UI.tab = tab;
    UI.renderNav();
    UI.renderTab(reduceMotion() ? 'fade' : dir);
    UI.setScene(XN.SCENE_BY_TAB[tab]);
  };
  UI.swipe = (dir) => {
    const i = ORDER.indexOf(UI.tab) + dir;
    if (i >= 0 && i < ORDER.length) UI.go(ORDER[i], dir > 0 ? 'slide-l' : 'slide-r');
  };

  /* ---------- layers + Android back button ----------
     While any layer is open we keep exactly one extra history entry. A back gesture pops the top layer
     and re-arms the entry if more layers remain; closing from code removes the entry afterwards. */
  UI.syncChrome = () => {
    doc.body.classList.toggle('has-screen', UI.layers.some((l) => l.kind === 'screen'));
    doc.body.classList.toggle('has-sheet', UI.layers.some((l) => l.kind !== 'screen'));
  };
  UI.pushLayer = (layer) => {
    UI.layers.push(layer);
    if (!UI.sentinel) { g.history.pushState({ xn: 1 }, ''); UI.sentinel = true; }
    UI.syncChrome();
  };
  UI.popLayer = () => {
    const l = UI.layers.pop();
    if (l) { try { l.destroy(); } catch (e) { console.error(e); } }
    UI.syncChrome();
    if (l && l.kind === 'screen') UI.restoreScene();
    return l;
  };
  UI.settle = () => {
    if (!UI.layers.length && UI.sentinel) { UI.sentinel = false; UI.ignore++; g.history.back(); }
  };
  UI.closeTop = () => { UI.popLayer(); g.setTimeout(UI.settle, 0); };
  g.addEventListener('popstate', () => {
    if (UI.ignore > 0) { UI.ignore--; return; }
    UI.sentinel = false;
    if (UI.layers.length) {
      UI.popLayer();
      if (UI.layers.length) { g.history.pushState({ xn: 1 }, ''); UI.sentinel = true; }
    }
  });

  /* ---------- sheets ---------- */
  UI.sheet = (o) => {
    const wrap = doc.createElement('div');
    wrap.className = 'layer sheet-layer ' + (o.cls || '');
    wrap.innerHTML = '<div class="backdrop" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-body"></div></div>';
    UI.el.layers.appendChild(wrap);
    const layer = { kind: o.cls === 'dialog' ? 'dialog' : 'sheet', el: wrap, destroy() { wrap.classList.remove('open'); wrap.classList.add('closing'); g.setTimeout(() => wrap.remove(), 230); if (o.onClose) o.onClose(sh); } };
    const sh = { el: wrap, body: wrap.querySelector('.sh-body'), st: o.state || {}, layer };
    sh.close = () => { const i = UI.layers.indexOf(layer); if (i === UI.layers.length - 1) UI.closeTop(); else if (i >= 0) { UI.layers.splice(i, 1); layer.destroy(); UI.syncChrome(); } };
    sh.update = () => {
      const sc = wrap.querySelector('.sh-scroll'), top = sc ? sc.scrollTop : 0;
      sh.body.innerHTML = o.render(sh);
      const sc2 = wrap.querySelector('.sh-scroll');
      if (sc2) sc2.scrollTop = top;
      if (o.after) o.after(sh);
    };
    layer.refresh = o.onChange ? () => o.onChange(sh) : null;
    wrap.addEventListener('click', (e) => {
      const a = e.target.closest('[data-s]');
      if (a && wrap.contains(a)) { UI.buzz(8); if (o.on && o.on[a.dataset.s]) { e.preventDefault(); o.on[a.dataset.s](a, e, sh); } return; }
      if (e.target.closest('[data-close]')) sh.close();
    });
    wrap.addEventListener('input', (e) => { const a = e.target.closest('[data-si]'); if (a && o.input && o.input[a.dataset.si]) o.input[a.dataset.si](a, e, sh); });
    wrap.addEventListener('change', (e) => { const a = e.target.closest('[data-sc]'); if (a && o.change && o.change[a.dataset.sc]) o.change[a.dataset.sc](a, e, sh); });
    sh.update();
    UI.pushLayer(layer);
    g.requestAnimationFrame(() => wrap.classList.add('open'));
    return sh;
  };

  UI.confirm = (o) =>
    new Promise((res) => {
      let done = false;
      UI.sheet({
        cls: 'dialog',
        render: () => `<div class="dlg"><h3>${esc(o.title)}</h3>${o.text ? `<p>${esc(o.text)}</p>` : ''}<div class="dlg-btns"><button class="btn" data-s="no">${esc(o.cancel || t('cancel'))}</button><button class="btn ${o.danger ? 'btn-danger' : 'btn-primary'}" data-s="yes">${esc(o.ok || t('ok'))}</button></div></div>`,
        on: { yes: (a, e, sh) => { done = true; res(true); sh.close(); }, no: (a, e, sh) => sh.close() },
        onClose: () => { if (!done) res(false); },
      });
    });

  /* ---------- screens (full page, slide in) ---------- */
  UI.screen = (name, params) => {
    const def = UI.screens[name];
    const wrap = doc.createElement('div');
    wrap.className = 'layer screen-layer';
    wrap.innerHTML = `<header class="s-head"><button class="icon-btn" data-act="back" aria-label="${esc(t('back'))}">${UI.icon('back')}</button><h2></h2><div class="s-right"></div></header><div class="s-scroll"></div>`;
    UI.el.layers.appendChild(wrap);
    const layer = { kind: 'screen', name, params: params || {}, def, el: wrap, destroy() { wrap.classList.remove('open'); wrap.classList.add('closing'); g.setTimeout(() => wrap.remove(), 230); if (def.onClose) def.onClose(layer); } };
    try { UI.renderScreen(layer); } catch (e) { console.error(e); wrap.remove(); UI.toast(t('error')); return null; }
    UI.pushLayer(layer);
    if (def.scene) UI.setScene(def.scene);
    if (def.after) def.after(layer);
    g.requestAnimationFrame(() => wrap.classList.add('open'));
    return layer;
  };
  UI.renderScreen = (layer, keep) => {
    const { el, def, params } = layer;
    el.querySelector('h2').innerHTML = def.title(params);
    el.querySelector('.s-right').innerHTML = def.right ? def.right(params, layer) : '';
    const sc = el.querySelector('.s-scroll'), top = sc.scrollTop;
    sc.innerHTML = def.body(params, layer);
    if (keep) sc.scrollTop = top;
    UI.after(sc);
  };
  UI.refresh = () => {
    UI.renderNav();
    UI.renderTab(false);
    UI.layers.forEach((l) => { if (l.kind === 'screen') UI.renderScreen(l, true); else if (l.refresh) l.refresh(); });
  };

  /* ---------- toasts ---------- */
  UI.toast = (msg, o) => {
    o = o || {};
    const box = UI.el.toasts;
    while (box.children.length >= 2) box.removeChild(box.firstChild);
    const el = doc.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = `<span>${esc(msg)}</span>${o.label ? `<button>${esc(o.label)}</button>` : ''}`;
    box.appendChild(el);
    const kill = () => { el.classList.add('out'); g.setTimeout(() => el.remove(), 250); };
    if (o.label) el.querySelector('button').addEventListener('click', () => { kill(); o.fn && o.fn(); });
    g.setTimeout(kill, o.ms || (o.label ? 6000 : 3000));
  };

  /* ---------- share / download helpers ---------- */
  UI.saveFile = async (name, text, mime) => {
    const blob = new g.Blob([text], { type: mime });
    try {
      const file = new g.File([blob], name, { type: mime });
      if (g.navigator.canShare && g.navigator.canShare({ files: [file] })) { await g.navigator.share({ files: [file], title: name }); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    const url = g.URL.createObjectURL(blob);
    const a = doc.createElement('a');
    a.href = url; a.download = name;
    doc.body.appendChild(a); a.click(); a.remove();
    g.setTimeout(() => g.URL.revokeObjectURL(url), 4000);
    return 'downloaded';
  };

  /* ---------- global event delegation ---------- */
  UI.bind = () => {
    doc.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const fn = UI.acts[a.dataset.act];
      if (fn) { e.preventDefault(); UI.buzz(8); fn(a, e); }
    });
    doc.addEventListener('input', (e) => { const a = e.target.closest('[data-in]'); if (a && UI.ins[a.dataset.in]) UI.ins[a.dataset.in](a, e); });
    doc.addEventListener('change', (e) => { const a = e.target.closest('[data-ch]'); if (a && UI.chs[a.dataset.ch]) UI.chs[a.dataset.ch](a, e); });
    let sx = 0, sy = 0, st = 0, ok = false;
    UI.el.view.addEventListener('touchstart', (e) => {
      if (UI.layers.length || e.touches.length !== 1) { ok = false; return; }
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
      ok = !e.target.closest('.noswipe, input, textarea, select');
    }, { passive: true });
    UI.el.view.addEventListener('touchend', (e) => {
      if (!ok) return;
      const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 650) UI.swipe(dx < 0 ? 1 : -1);
    }, { passive: true });
    UI.acts.back = () => UI.closeTop();
    UI.acts.tab = (a) => UI.go(a.dataset.tab);
    g.setInterval(() => UI.tickTimers(doc), 1000);
    g.setInterval(() => {
      if (!doc.hidden && XN.calc.activeShift(S.state) && (UI.tab === 'shift' || UI.tab === 'home') && !UI.layers.length) UI.renderTab(false);
    }, 30000);
  };

  UI.mount = () => {
    UI.el = { bg: doc.getElementById('bg'), view: doc.getElementById('view'), nav: doc.getElementById('nav'), layers: doc.getElementById('layers'), toasts: doc.getElementById('toasts'), lock: doc.getElementById('lock') };
    UI.el.bg.innerHTML = XN.scenes.all();
    UI.loadBgImage();
    UI.bind();
  };

  XN.i18n.add('uz', { nav_home: 'Bosh', nav_shift: 'Smena', nav_voice: 'Ovoz', nav_report: 'Hisobot', nav_accounts: 'Hisob', ok: 'OK', cancel: 'Bekor qilish', back: 'Orqaga', save: 'Saqlash', delete: "O'chirish", edit: 'Tahrirlash', close: 'Yopish', undo: 'Qaytarish', add: "Qo'shish", saved: 'Saqlandi', deleted: "O'chirildi", error: 'Xatolik', yes: 'Ha', no: "Yo'q", name: 'Nomi', amount: 'Summa', date: 'Sana', note: 'Izoh', done: 'Tayyor', corrupt_warn: "Saqlangan ma'lumot o'qilmadi. Nusxasi saqlab qo'yildi.", update_ready: 'Yangi versiya tayyor', reload: 'Yangilash' });
  XN.i18n.add('ru', { nav_home: 'Главная', nav_shift: 'Смена', nav_voice: 'Голос', nav_report: 'Отчёт', nav_accounts: 'Счета', ok: 'ОК', cancel: 'Отмена', back: 'Назад', save: 'Сохранить', delete: 'Удалить', edit: 'Изменить', close: 'Закрыть', undo: 'Вернуть', add: 'Добавить', saved: 'Сохранено', deleted: 'Удалено', error: 'Ошибка', yes: 'Да', no: 'Нет', name: 'Название', amount: 'Сумма', date: 'Дата', note: 'Заметка', done: 'Готово', corrupt_warn: 'Сохранённые данные не прочитаны. Копия сохранена.', update_ready: 'Доступна новая версия', reload: 'Обновить' });
})(window);

</script>
<script>
(function (g) {
  'use strict';
  const XN = g.XN, U = XN.U, C = XN.calc, S = XN.store, UI = XN.UI, t = XN.t, esc = U.esc, Ch = XN.charts;
  const M = (n, cur, o) => U.money(n, cur || 'RUB', o);

  /* ---------- shared: how a transaction is shown in lists ---------- */
  UI.txView = (tx) => {
    const st = S.state, cm = XN.catMap(st);
    const acc = S.acc(tx.acc), to = S.acc(tx.to);
    const accName = acc ? acc.name : '';
    let ico = '🏷️', title = '', amt = '', cls = '';
    const foreign = tx.cur !== 'RUB' && tx.type !== 'transfer' ? `<small>${M(tx.rub, 'RUB')}</small>` : '';
    if (tx.type === 'income' || tx.type === 'expense') {
      const c = cm[tx.cat];
      ico = c ? c.ico : '🏷️'; title = c ? XN.catName(c) : '—';
      cls = tx.type === 'income' ? 'pos' : 'neg';
      amt = M(tx.type === 'income' ? tx.amount : -tx.amount, tx.cur, { plus: tx.type === 'income' });
    } else if (tx.type === 'transfer') {
      ico = '🔁'; title = (acc ? acc.name : '?') + ' → ' + (to ? to.name : '?'); cls = '';
      amt = M(tx.amount, tx.cur) + (to && to.cur !== tx.cur ? `<small>${M(tx.toAmt, to.cur)}</small>` : '');
    } else if (tx.type === 'remit') {
      ico = '💸'; title = t('remit_title'); cls = 'neg'; amt = M(-tx.rub, 'RUB') + `<small>$ ${U.fmtNum(tx.usd)} · ${U.fmtNum(tx.rate)}</small>`;
    } else if (tx.type === 'debt') {
      const d = st.debts.find((x) => x.id === tx.debtId);
      const out = tx.op === 'pay' || tx.op === 'lend';
      ico = '🏦'; title = (d ? d.name : t('debts_title')) + ' · ' + t('dop_' + tx.op); cls = out ? 'neg' : 'pos';
      amt = M(out ? -tx.amount : tx.amount, tx.cur, { plus: !out });
    } else if (tx.type === 'goal') {
      const gl = st.goals.find((x) => x.id === tx.goalId);
      ico = gl ? gl.ico : '🎯'; title = gl ? gl.name : t('goals_title'); cls = tx.amount >= 0 ? 'neg' : 'pos'; amt = M(-tx.amount, tx.cur);
    }
    const sub = [U.fmtTime(tx.ts), accName, tx.note].filter(Boolean).join(' · ');
    return { ico, title, sub, amt, cls, foreign };
  };
  UI.txRow = (tx, o) => {
    const v = UI.txView(tx);
    const d = o && o.date ? U.fmtDate(tx.ts) + ' · ' : '';
    return `<button class="row tx" data-act="tx" data-id="${tx.id}"><span class="row-ico">${esc(v.ico)}</span><span class="row-m"><b>${esc(v.title)}</b><small>${d}${esc(v.sub)}</small></span><span class="row-r ${v.cls}">${v.amt}</span></button>`;
  };
  UI.acts.tx = (a) => { const tx = S.state.txs.find((x) => x.id === a.dataset.id); if (tx) UI.openEdit(tx); };

  const metric = (label, val, cls, extra) => `<div class="metric"><span class="lbl">${label}</span><b class="${cls || ''}">${val}</b>${extra || ''}</div>`;
  const secH = (title, right) => `<div class="sec-h"><h3>${title}</h3>${right || ''}</div>`;
  UI.secH = secH; UI.metric = metric;

  /* ================= HOME ================= */
  UI.pages.home = () => {
    const s = S.state, now = Date.now();
    const [d0, d1] = C.dayRange(now);
    const day = C.summary(s, d0, d1), mon = C.monthSummary(s, now);
    const goal = +s.settings.dailyGoal || 0, sh = C.activeShift(s);
    const rem = C.reminders(s, now), tips = XN.advisor.tips(s, now).slice(0, 2);
    const cm = XN.catMap(s);
    const quick = s.quick.map((id) => cm[id]).filter((c) => c && !c.hidden);
    const recent = s.txs.slice().sort((a, b) => b.ts - a.ts).slice(0, 5);
    const pct = goal > 0 ? day.net / goal : 0;
    const dateStr = XN.tl('wd')[U.wd(now)] + ', ' + U.fmtDate(now);

    const remRows = rem.slice(0, 4).map((r) => {
      const when = r.daysLeft < 0 ? t('late_n', { n: -r.daysLeft }) : r.daysLeft === 0 ? t('today') : r.daysLeft === 1 ? t('tomorrow') : t('in_n', { n: r.daysLeft });
      return `<div class="row rem ${r.daysLeft < 0 ? 'late' : r.daysLeft === 0 ? 'now' : ''}"><span class="row-ico">${r.kind === 'debt' ? '🏦' : r.kind === 'fine' ? '🚨' : '🗓️'}</span>
        <span class="row-m"><b>${esc(r.title)}</b><small>${when}</small></span><span class="row-r"><b>${M(r.amount, r.cur)}</b></span>
        <button class="btn btn-sm" data-act="rem-pay" data-kind="${r.kind}" data-id="${r.id}">${t('pay')}</button></div>`;
    }).join('');

    return `<section class="page">
      <header class="top"><div><div class="mut">${esc(dateStr)}</div><h1>${t('home_title')}</h1></div>
        <div class="top-r"><button class="icon-btn" data-act="history" aria-label="${t('history_title')}">${UI.icon('search')}</button><button class="icon-btn" data-act="settings" aria-label="${t('settings_title')}">${UI.icon('gear')}</button></div></header>

      <div class="card hero">
        <div class="hero-l"><span class="lbl">${t('today_net')}</span>
          <b class="big ${day.net >= 0 ? 'pos' : 'neg'}" data-count="${Math.round(day.net)}" data-plus="1" data-key="home-hero">${M(day.net, 'RUB', { plus: true })}</b>
          <span class="sub">${t('income')} ${M(day.income)} · ${t('work_costs')} ${M(day.opExp)}</span></div>
        ${goal > 0 ? `<div class="hero-r">${Ch.ring(pct, { size: 86, stroke: 9 })}<span class="mut">${t('goal')} ${M(goal)}</span></div>` : ''}
      </div>

      ${evening(s, now, day, sh)}
      ${sh ? `<button class="banner" data-act="tab" data-tab="shift"><i class="live-dot"></i><span>${t('shift_running')}</span><b data-timer="${sh.start}">${U.fmtDur(now - sh.start)}</b>${UI.icon('chev', 18)}</button>`
        : `<button class="banner start" data-act="tab" data-tab="shift">${UI.icon('wheel', 20)}<span>${t('shift_start_hint')}</span>${UI.icon('chev', 18)}</button>`}

      ${secH(t('quick_add'), `<button class="link" data-act="edit-quick">${t('edit')}</button>`)}
      <div class="quick">${quick.map((c) => `<button class="qk" data-act="quick" data-cat="${c.id}"><span class="qe">${esc(c.ico)}</span><span class="qn">${esc(XN.catName(c))}</span></button>`).join('')}</div>

      ${rem.length ? `${secH(t('reminders'))}<div class="card list">${remRows}</div>` : ''}
      ${tips.length ? `${secH(t('advice'))}<div class="tips">${tips.map(tipHtml).join('')}</div>` : ''}

      ${secH(t('this_month') + ' · ' + U.monthName(now), `<button class="link" data-act="tab" data-tab="report">${t('more')}</button>`)}
      <div class="card">
        <div class="metrics3">${metric(t('income'), M(mon.income), 'pos')}${metric(t('work_costs'), M(mon.opExp), 'neg')}${metric(t('net_profit'), M(mon.net, 'RUB', { plus: true }), mon.net >= 0 ? 'pos' : 'neg')}</div>
        <div class="kv"><span>${t('family_costs')}</span><b>${M(mon.famExp)}</b></div>
        ${mon.remit ? `<div class="kv"><span>${t('remit_sent')}</span><b>${M(mon.remit)}</b></div>` : ''}
        ${mon.debtOut ? `<div class="kv"><span>${t('debt_payments')}</span><b>${M(mon.debtOut)}</b></div>` : ''}
        <div class="kv total"><span>${t('cashflow')}</span><b class="${mon.cashflow >= 0 ? 'pos' : 'neg'}">${M(mon.cashflow, 'RUB', { plus: true })}</b></div>
      </div>

      ${secH(t('recent'), `<button class="link" data-act="history">${t('all')}</button>`)}
      ${recent.length ? `<div class="card list">${recent.map((x) => UI.txRow(x)).join('')}</div>` : `<div class="card empty"><p>${t('empty_ops')}</p></div>`}
    </section>`;
  };
  const evening = (s, now, day, sh) => {
    if (new Date(now).getHours() < 23 || s.settings.checkedDay === U.dayKey(now)) return '';
    return `<div class="card evening"><b>🌙 ${t('eve_title')}</b><p class="mut">${sh ? t('eve_shift') : t('eve_text', { n: M(day.net, 'RUB', { plus: true }) })}</p>
      <div class="btn-row">${sh ? `<button class="btn" data-act="shift-end">${t('shift_finish')}</button>` : `<button class="btn" data-act="eve-check">${t('eve_check')}</button>`}<button class="btn btn-primary" data-act="eve-done">${UI.icon('check', 18)} ${t('eve_done')}</button></div></div>`;
  };
  UI.acts['eve-check'] = () => UI.screen('history', { day: U.sod(Date.now()), m: U.som(Date.now()) });
  UI.acts['eve-done'] = () => { S.state.settings.checkedDay = U.dayKey(Date.now()); S.commit(); UI.toast(t('eve_ok')); };
  const tipHtml = (x) => `<div class="tip ${x.level}"><span class="tip-i">${x.ico}</span><p>${esc(t(x.key, x.vars))}</p></div>`;
  UI.tipHtml = tipHtml;

  UI.acts.quick = (a) => UI.openAdd({ cat: a.dataset.cat });
  UI.acts.history = () => UI.screen('history', {});
  UI.acts.settings = () => UI.screen('settings', {});
  UI.acts.add = () => UI.openAdd();
  UI.acts['rem-pay'] = (a) => UI.payReminder(a.dataset.kind, a.dataset.id);

  /* ================= SHIFT ================= */
  UI.sd = UI.sd || { tariff: null, rent: null };
  UI.pages.shift = () => {
    const s = S.state, now = Date.now(), sh = C.activeShift(s), goal = +s.settings.dailyGoal || 0;
    if (!sh) {
      if (UI.sd.tariff == null) UI.sd.tariff = s.settings.tariff;
      if (UI.sd.rent == null) UI.sd.rent = s.settings.rent;
      const done = s.shifts.filter((x) => x.end).sort((a, b) => b.start - a.start);
      const week = done.filter((x) => x.start >= U.weekStart(now));
      let wn = 0, wh = 0;
      week.forEach((x) => { const st = C.shiftStats(s, x, x.end); wn += st.net; wh += st.hours; });
      return `<section class="page"><header class="top"><div><div class="mut">${t('shift_sub')}</div><h1>${t('shift_title')}</h1></div></header>
        <div class="card">
          <span class="lbl">${t('tariff')}</span>
